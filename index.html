<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rota">
<meta name="theme-color" content="#86a686">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Rota</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400;1,6..96,600&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: every screen is a color field on top and a dark sheet below. The field takes the color of the night it is about,
   with the night's name in large italic serif and progress rings on the color. The sheet holds everything you tap. */
:root{
  color-scheme:dark;
  --bg:#141210; --surface:#1f1c18; --surface-2:#2c2721; --line:#2c2721; --fg:#f4ede2; --muted:#a8a094; --faint:#8a8278; --ink:#141210;
  --f:#86a686; --fl:#abc7a9; --on:#142016; --accent:#a9cfa8;
  --acid:#bda6e3; --ret:#e39a80; --aza:#e2b05a; --bp:#9dbbe0; --rec:#a9cfa8; --warn:#e9a55c;
  --sq-acid:#a58bd0; --sq-ret:#cf7f63; --sq-aza:#d39a3c; --sq-bp:#7d9dc0; --sq-rec:#8aa98a; --sq-ink:#141210;
  --serif:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --sans:"Instrument Sans","Helvetica Neue","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--f)}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;min-height:100vh}
#app{max-width:500px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
h1,h2,h3,p,ol,ul{margin:0;padding:0}
ol,ul{list-style:none}
h2{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.15}
.sub{color:var(--muted);font-size:14px}
.eyebrow,.lab{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;display:block}
.num{font-variant-numeric:tabular-nums lining-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.field :focus-visible{outline-color:var(--on)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.c-acid{color:var(--acid)} .c-ret{color:var(--ret)} .c-aza{color:var(--aza)} .c-bp{color:var(--bp)} .c-rec{color:var(--rec)}

/* Color field */
.field{position:relative;background:var(--f);color:var(--on);padding:10px 20px 50px;overflow:hidden;flex:none;transition:background .35s}
.field::before{content:"";position:absolute;right:-90px;top:-80px;width:310px;height:310px;border-radius:50%;background:var(--fl);opacity:.75;transition:background .35s}
.field>*{position:relative;z-index:1}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.bar .right{display:flex;align-items:center;gap:4px}
.mark{font-family:var(--serif);font-style:italic;font-size:27px;letter-spacing:-.01em}
.date{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.icon{width:44px;height:44px;display:grid;place-items:center;margin-right:-11px}
.kick{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;margin-top:22px}
.field h1{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(52px,16.5vw,80px);line-height:.92;letter-spacing:-.04em;margin:8px 0 12px -2px;overflow-wrap:anywhere}
.field h1.q{font-size:clamp(34px,10.4vw,48px);line-height:1.02;letter-spacing:-.025em}
.field p{font-size:14.5px;font-weight:500;max-width:32ch;text-wrap:pretty}
.keys{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:12px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.85}
.rings{position:absolute!important;right:18px;top:62px;width:124px;height:124px}
.rings svg{width:100%;height:100%;transform:rotate(-90deg)}
.rings .t{stroke:var(--on);opacity:.16} .rings .p{stroke:var(--on);transition:stroke-dashoffset .7s cubic-bezier(.3,.8,.3,1)}
.rings div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rings b{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1}
.rings span{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.85}
.field.full .rings{filter:drop-shadow(0 0 14px rgba(255,255,255,.8))}
.has-rings .kick{margin-top:12px} .has-rings .k2{margin-top:92px}
.fstats{display:flex;gap:28px;margin-top:4px}
.fstats b{font-family:var(--serif);font-weight:600;font-size:36px;line-height:1;display:block}
.fstats span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}

/* Sheet */
.sheet{position:relative;z-index:2;background:var(--bg);color:var(--fg);border-radius:28px 28px 0 0;margin-top:-26px;padding:24px 20px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:24px;flex:1}
.rowhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card{background:var(--surface);border-radius:22px;padding:20px;min-width:0}
.tabs2{display:flex;gap:8px;align-items:center}
.tabs2 button{padding:9px 16px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1.5px solid var(--surface-2);color:var(--muted)}
.tabs2 button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tabs2 .count{margin-left:auto;font-family:var(--serif);font-size:23px}
.list{margin-top:-12px}
.list li{border-top:1.5px solid var(--line)}
.list li:first-child{border-top:0}
.row{display:grid;grid-template-columns:46px minmax(0,1fr) auto 28px;gap:10px;align-items:center;width:100%;padding:13px 0}
.row .idx{font-family:var(--serif);font-style:italic;font-size:33px;line-height:1;color:var(--accent)}
.row .what b{font-weight:700;font-size:15.5px;display:block}
.row .what small{font-size:13px;color:var(--muted)}
.tagc{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.tick{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;color:transparent;flex:none;transition:background .2s,box-shadow .2s}
.tick svg{width:15px;height:15px;stroke-width:2.4}
[aria-pressed="true"]>.tick{background:var(--accent);border-color:transparent;color:var(--ink);box-shadow:0 0 14px var(--accent)}
.row[aria-pressed="true"] .what b{color:var(--faint)}
.row[aria-pressed="true"] .idx{opacity:.4}
.empty{padding:18px 0;color:var(--muted);font-size:14px}
.feel{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pills{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.feel .pills{gap:6px;grid-auto-columns:auto;flex:none}
.pill{padding:10px 14px;border-radius:99px;border:1.5px solid var(--surface-2);text-align:center;font-size:13px;font-weight:600;color:var(--muted)}
.pill[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.feel .pill{padding:8px 13px}
.note,.why{font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.4;color:var(--muted);text-wrap:pretty}
.cheer{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--accent);text-align:center}

/* Week */
.arrows{display:flex;gap:6px}
.arrows button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--surface-2);display:grid;place-items:center}
.arrows button:disabled{opacity:.3}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.sq{position:relative;aspect-ratio:1/1.3;border-radius:11px;display:flex;flex-direction:column;justify-content:space-between;padding:6px 6px 5px;color:var(--sq-ink);width:100%;font-size:10px;font-weight:700;letter-spacing:.02em}
.sq b{font-family:var(--serif);font-weight:600;font-size:18px;line-height:1}
.s-acid{background:var(--sq-acid)} .s-ret{background:var(--sq-ret)} .s-aza{background:var(--sq-aza)} .s-bp{background:var(--sq-bp)} .s-rec{background:var(--sq-rec)}
.sq[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:2px}
.sq .ap{position:absolute;top:7px;right:6px;display:flex;gap:2px}
.sq .ap i{width:5px;height:5px;border-radius:50%;background:rgba(20,18,16,.22)}
.sq .ap i.on{background:var(--sq-ink)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:15px 0;border-radius:99px;background:var(--accent);color:var(--ink);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.btn.ghost{background:transparent;border:1.5px solid var(--surface-2);color:var(--fg)}
.btn:disabled{opacity:.35}
.btn svg{width:16px;height:16px}

/* Progress */
.map{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:7px;margin-top:18px}
.map i{aspect-ratio:1;border-radius:50%;background:var(--surface-2)}
.map i.l1{background:color-mix(in srgb,var(--accent) 45%,var(--surface-2))}
.map i.l2{background:var(--accent);box-shadow:0 0 8px color-mix(in srgb,var(--accent) 60%,transparent)}
.map i.now{outline:2px solid var(--fg);outline-offset:2px}
.mile{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:16px;align-items:center;width:100%;padding:14px 0}
.mile+.mile{border-top:1.5px solid var(--line)}
.mile b{font-weight:700;font-size:15.5px;display:block}
.mile[aria-pressed="true"] b{color:var(--faint)}
.tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--warn)}
.sync,.fine{text-align:center;font-size:12px;color:var(--faint)}
.link{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--accent);padding:8px 0}
.cmp{position:relative;aspect-ratio:3/4;border-radius:22px;overflow:hidden;background:var(--surface);margin-top:16px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none;pointer-events:none}
.lbl{position:absolute;top:12px;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.lbl.l{left:12px} .lbl.r{right:12px}
.cmp .bar{position:absolute;top:0;bottom:0;width:2px;min-height:0;background:#fff;transform:translateX(-1px);pointer-events:none;display:block}
.cmp .bar::after{content:"";position:absolute;top:50%;left:50%;width:36px;height:36px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 2px 10px rgba(0,0,0,.4)}
.side{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.side figure{margin:0;position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:var(--surface)}
.side img{width:100%;height:100%;object-fit:cover;display:block}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pick select{width:100%;appearance:none;-webkit-appearance:none;background:var(--surface);border:1.5px solid var(--surface-2);border-radius:14px;padding:11px 12px;font-size:14px;margin-top:7px}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:16px;padding:3px 3px 4px}
.thumbs button{flex:none;width:62px}
.thumbs img{width:62px;height:82px;object-fit:cover;border-radius:12px;display:block;border:2px solid transparent}
.thumbs button[aria-pressed="true"] img{border-color:var(--accent)}
.thumbs small{display:block;text-align:center;font-size:11px;color:var(--muted);margin-top:5px}

/* Shop and butter */
.meter{height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.item{display:flex;align-items:center;gap:16px;width:100%;padding:14px 0}
.item+.item{border-top:1.5px solid var(--line)}
.item .what{flex:1;min-width:0}
.item b{font-weight:700;font-size:15.5px;display:block}
.item[aria-pressed="true"] b{color:var(--faint);text-decoration:line-through}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;margin:18px 0 8px}
.stack i{display:block;min-width:3px}
.ing{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 0}
.ing+.ing{border-top:1.5px solid var(--line)}
.ing i{width:10px;height:10px;border-radius:50%}
.ing .pct{color:var(--muted);font-size:13px;min-width:44px;text-align:right}
.ing b{min-width:66px;text-align:right;font-family:var(--serif);font-weight:400;font-size:19px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--surface-2);display:grid;place-items:center;font-size:19px}
.stepper b{font-family:var(--serif);font-weight:400;font-size:22px;min-width:74px;text-align:center}
.how li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:11px 0;align-items:center}
.how li+li{border-top:1.5px solid var(--line)}
.how li span{font-family:var(--serif);font-style:italic;font-size:26px;line-height:1;color:var(--accent)}

/* Shelf */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
.pcard{display:flex;flex-direction:column;gap:10px;width:100%;min-width:0}
.pic{aspect-ratio:4/5;border-radius:18px;background:var(--surface);overflow:hidden;display:grid;place-items:center;position:relative;width:100%}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.pic .init{font-family:var(--serif);font-style:italic;font-weight:600;font-size:76px;color:var(--muted);opacity:.32;line-height:1}
.pcard.off .pic,.pcard.off b{opacity:.45}
.pcard b{font-weight:700;font-size:15px;display:block;margin-top:4px;overflow-wrap:anywhere}
.badge{position:absolute;left:10px;bottom:10px;padding:4px 9px;border-radius:99px;background:var(--accent);color:var(--ink);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.detail{display:flex;flex-direction:column;gap:20px}
.detail .pic{max-width:220px;margin:0 auto}

/* Settings and forms */
.prod{padding:6px 0 12px}
.txt{width:100%;background:transparent;border:0;border-bottom:1.5px solid transparent;padding:4px 0 3px;font-size:16px;font-weight:600;border-radius:0}
.txt::placeholder{color:var(--faint);font-weight:400}
.txt:focus{outline:none;border-bottom-color:var(--accent)}
.sw{width:48px;height:29px;border-radius:99px;background:var(--surface-2);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:var(--muted);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(19px);background:var(--ink)}
.add{display:grid;gap:10px;margin-top:16px}
.add .txt{border:1.5px solid var(--surface-2);border-radius:14px;padding:13px 14px;background:var(--bg)}
.add select.txt{appearance:none;-webkit-appearance:none}
.frow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 0;border-top:1.5px solid var(--line)}
.frows .frow:first-child{border-top:0}
.frow>label,.frow>span{font-size:15px;font-weight:500}
.frow .txt{max-width:150px;text-align:right}
.frow input[type=date],.frow select{background:var(--surface);border:1.5px solid var(--surface-2);border-radius:12px;padding:8px 10px;max-width:160px;appearance:none;-webkit-appearance:none;font-size:15px}
.checks{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.checks li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;font-size:14px;color:var(--muted)}
.checks svg{width:18px;height:18px;margin-top:1px}
.checks .ok svg{color:var(--rec)} .checks .tip svg{color:var(--accent)} .checks .warn svg{color:var(--warn)}
.checks .warn{color:var(--fg);background:color-mix(in srgb,var(--warn) 15%,transparent);padding:12px 14px;border-radius:14px;margin-inline:-14px}

/* Setup */
.field.tall{padding-bottom:70px}
.hero-mark{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(96px,32vw,150px);line-height:.9;letter-spacing:-.05em;margin:13vh 0 18px -4px}
.opts{margin-top:-12px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:15px 0}
.opt+.opt{border-top:1.5px solid var(--line)}
.opt .what{flex:1;min-width:0}
.opt b{font-weight:700;font-size:15.5px;display:block}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:26px 20px calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 34%)}
.cta .btn{max-width:460px;margin:0 auto}

/* Dock */
.dock{position:fixed;z-index:5;left:0;right:0;bottom:0;background:var(--bg);border-top:1.5px solid var(--line);padding:4px 10px calc(6px + env(safe-area-inset-bottom,0px))}
.dock div{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;max-width:500px;margin:0 auto}
.dock button{padding:15px 0 13px;text-align:center;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--faint)}
.dock button[aria-current="page"]{color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent-2)"/></linearGradient></defs></svg>
<main id="app"></main>
<nav class="dock" aria-label="Sections" id="docknav"><div id="dock"></div></nav>
<input type="file" accept="image/*" id="shot" hidden>
<input type="file" accept="application/json,.json" id="restore" hidden>

<script>
(function(){
  var PERSONAL=false, MY_NAME='', DAYS=84;
  var app=document.getElementById('app'), dock=document.getElementById('dock'), docknav=document.getElementById('docknav');
  var ref=null, writing=false, dirty=false, readOnly=false, syncMsg='';

  var P={
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5V5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8"/>',
    moon:'<path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/>',
    check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    alert:'<path d="M12 4l9 15.500H3zM12 10v4.500M12 17v.200"/>',
    spark:'<path d="M12 3.500c.600 4.600 3.300 7.300 8 8-4.700.700-7.400 3.400-8 8-.600-4.600-3.300-7.300-8-8 4.700-.700 7.400-3.400 8-8z"/>',
    cal:'<path d="M4.5 6.5h15v13h-15zM4.5 10.5h15M8.5 4v4M15.5 4v4"/>',
    chart:'<path d="M5 19v-8M12 19V5M19 19v-6"/>',
    bag:'<path d="M5.5 8h13l-1 12h-11zM9 8V6.5a3 3 0 0 1 6 0V8"/>',
    jar:'<path d="M7 8h10v9a3 3 0 0 1-3 3h-4a3 3 0 0 1-3-3zM6 4.5h12V8H6z"/>',
    cam:'<path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
    tune:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
    trash:'<path d="M5 7h14M9 7V4.5h6V7M7 7l1 12.5h8L17 7"/>',
    left:'<path d="M14.5 6l-6 6 6 6"/>', right:'<path d="M9.5 6l6 6-6 6"/>'

      body='<div class="opts">'+Object.keys(GOALS).map(function(g){return optRow('goal',g,GOALS[g],'',!!ui.goals[g])}).join('')+'</div>'+
        '<h2>How does your skin take to new products?</h2>'+
        '<div class="opts">'+[['Rarely reacts','A two week ease in'],['Sometimes stings','A three week ease in'],['Marks or irritates easily','A four week ease in']].map(function(o,i){return optRow('react',i,o[0],o[1],ui.react===i)}).join('')+'</div>';
      cta='<button class="btn" data-act="ob" data-id="1">Continue</button>';
    }else if(s===2){
      var any=Object.keys(ui.shelf).some(function(c){return ui.shelf[c]});
      fld='<div class="field">'+back('-1','ob')+head('2 of 3','What is on your shelf?','<p>Pick the types you own. You can name the exact products later.</p>','q')+'</div>';
      body=SHELF.map(function(g){return '<section><p class="eyebrow">'+g[0]+'</p><div class="opts" style="margin-top:4px">'+g[1].map(function(o){return optRow('shelf',o[0],o[1],o[2],!!ui.shelf[o[0]])}).join('')+'</div></section>'}).join('');
      cta='<button class="btn" data-act="ob" data-id="1"'+(any?'':' disabled')+'>Build my rotation</button>';
    }else{
      var m=weekMap(modes(null));
      fld='<div class="field">'+back('-1','ob')+head('3 of 3','Your rotation','<p>A normal week once you are past the ease in.</p>','q')+'</div>';
      body='<div class="strip">'+m.map(function(t,i){return '<div class="sq s-'+t+'"><span>'+DOW[i]+'</span><b>&nbsp;</b><span>'+NIGHT[t].s+'</span></div>'}).join('')+'</div>'+
        '<section><h2>Routine check</h2>'+checksHtml()+'</section>'+
        '<div class="frows"><div class="frow"><label for="name">Your name</label><input class="txt" id="name" data-edit="name" maxlength="20" placeholder="Optional" value="'+esc(state.name)+'"></div></div>';
      cta='<button class="btn" data-act="finish">Start my rotation</button>';
    }
    return fld+'<div class="sheet">'+body+'</div><div class="cta">'+cta+'</div>';
  }
  function build(){
    var out=[];
    CAT_ORDER.forEach(function(c){
      var ex=state.products.filter(function(p){return p.cat===c});
      if(ex.length)ex.forEach(function(p){var was=p.on;p.on=!!ui.shelf[c];if(p.on&&!was)p.since=key(new Date());out.push(p)});
      else if(ui.shelf[c])out.push({id:c,cat:c,n:'',p:'',w:'',on:true,x:0,since:key(new Date())});
    });
    state.products=out; state.ramp=[2,3,4][ui.react]||2; state.goals=Object.keys(ui.goals).filter(function(g){return ui.goals[g]});
  }

  function tabs(){var t=[['today','Today'],['week','Week'],['progress','Progress'],['shelf','Shelf']]; if(state.extras)t.push(['more','More']); return t}
  function render(){
    var html;
    if(!state.setup){docknav.hidden=true; html=vOnboard(); applyTheme('brand'); app.innerHTML=html; return}
    var st=stats(); if(ui.week===null)ui.week=st.week;
    var views={today:vToday,week:vWeek,progress:vProgress,shelf:vShelf,more:vMore,settings:vSettings};
    if(ui.tab==='shop'||ui.tab==='butter'){ui.more=ui.tab;ui.tab='more'}
    if(!views[ui.tab]||(!state.extras&&ui.tab==='more'))ui.tab='today';
    ui.tone=nightOf(new Date()).t;
    html=views[ui.tab](st); applyTheme(ui.tone); app.innerHTML=html;
    docknav.hidden=false;
    dock.innerHTML=tabs().map(function(t){return '<button data-act="tab" data-id="'+t[0]+'"'+(t[0]===ui.tab?' aria-current="page"':'')+'>'+t[1]+'</button>'}).join('');
    var arcs=document.querySelectorAll('.rings .p');
    if(arcs.length)requestAnimationFrame(function(){requestAnimationFrame(function(){arcs.forEach(function(a){a.setAttribute('stroke-dashoffset',a.dataset.to)})})});
  }

  /* ---------- events ---------- */
  function prod(id){return state.products.filter(function(p){return p.id===id})[0]}
  function id2(){return ui.prodSel}
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-act]'); if(!b||b.disabled)return;
    var a=b.dataset.act, id=b.dataset.id, now=new Date(), p;
    if(a==='tab'){ui.tab=id;ui.prodSel=null;ui.rm=false; try{history.replaceState(null,'','#'+id)}catch(x){} render(); window.scrollTo(0,0)}
    else if(a==='slot'){ui.slot=id;render()}
    else if(a==='step')toggleStep(b.dataset.day?parse(b.dataset.day):now,b.dataset.slot||ui.slot,id);
    else if(a==='wslot'){ui.wslot=id;render()}
    else if(a==='feel'){var k=key(now); if(state.feel[k]===id)delete state.feel[k]; else state.feel[k]=id; commit()}
    else if(a==='day'){ui.day=id;render()}
    else if(a==='wk'){ui.week=Math.min(12,Math.max(1,ui.week+(+id)));ui.day=null;render()}
    else if(a==='slotday'){var d=parse(ui.day);put(ui.day,id,isDone(d,id)?null:true)}
    else if(a==='mile'){var mm=miles().filter(function(x){return x.id===id})[0];
      if(state.miles[id]){delete state.miles[id];commit()} else if(mm&&mm.cam&&!ui.photoMsg){ui.pendingMile=id;ui.shotFor=null;shot.click()} else {state.miles[id]=true;commit()}}
    else if(a==='photo'){ui.pendingMile=null;ui.shotFor=null;shot.click()}
    else if(a==='cmpmode'){ui.cmpMode=id;render()}
    else if(a==='selp'){ui.selP=ui.selP===id?null:id;ui.rm=false;render()}
    else if(a==='rmphoto'){if(!ui.rm){ui.rm=true;render()} else {var gone=ui.selP;ui.selP=null;ui.rm=false;tx('readwrite',function(o){return o.delete(gone)}).then(loadPhotos).catch(function(){render()})}}
    else if(a==='shop'){if(state.shop[id])delete state.shop[id];else state.shop[id]=true;
      if(id==='oilcl')state.products.forEach(function(x){if(x.cat==='oil')x.on=!!state.shop.oilcl}); commit()}
    else if(a==='recipe'){ui.recipe=id;render()}
    else if(a==='batch'){state.batch=Math.min(1000,Math.max(50,state.batch+(+id)));commit()}
    else if(a==='theme'){state.theme=id;commit()}
    else if(a==='sw'){p=prod(id); if(p){p.on=!p.on; if(p.on)p.since=key(now); commit()}}
    else if(a==='more'){ui.more=id;render()}
    else if(a==='pmax'){p=prod(ui.prodSel); if(p){p.max=Math.max(0,Math.min(LIM[CATS[p.cat].act]||7,(p.max||0)+(+id)));commit()}}
    else if(a==='pused'){p=prod(ui.prodSel); if(p){p.used=!p.used;commit()}}
    else if(a==='export')exportData();
    else if(a==='import')document.getElementById('restore').click();
    else if(a==='psel'){ui.prodSel=id;ui.rm=false;render();window.scrollTo(0,0)}
    else if(a==='pback'){ui.prodSel=null;ui.rm=false;render();window.scrollTo(0,0)}
    else if(a==='pwhen'){p=prod(id2(b)); if(p){p.w=id==='both'?'':id;commit()}}
    else if(a==='pphoto'){ui.shotFor=id;shot.click()}
    else if(a==='prmphoto'){delete ui.pimg[id];tx('readwrite',function(o){return o.delete(id)},'prod').then(loadPhotos).catch(function(){render()})}
    else if(a==='extras'){state.extras=!state.extras;commit()}
    else if(a==='when'){ui.when=id;render()}
    else if(a==='addp'){var nid='c'+Date.now().toString(36);state.products.push({id:nid,cat:CATS[ui.newCat]?ui.newCat:'se',n:'',p:ui.newP.trim().slice(0,40),w:'',on:true,x:1,since:key(now)}); ui.newP='';ui.prodSel=nid;commit();window.scrollTo(0,0)}
    else if(a==='delp'){if(!ui.rm){ui.rm=true;render()} else {ui.rm=false;ui.prodSel=null;state.products=state.products.filter(function(x){return x.id!==id});delete ui.pimg[id];tx('readwrite',function(o){return o.delete(id)},'prod').catch(function(){});commit();window.scrollTo(0,0)}}
    else if(a==='redo'){ui.ob=1;ui.shelf={};state.products.forEach(function(x){if(x.on)ui.shelf[x.cat]=true});ui.goals={};state.goals.forEach(function(g){ui.goals[g]=true});
      ui.react=Math.max(0,[2,3,4].indexOf(state.ramp));state.setup=false;commit();window.scrollTo(0,0)}
    else if(a==='goal'){ui.goals[id]=!ui.goals[id];render()}
    else if(a==='react'){ui.react=+id;render()}
    else if(a==='shelf'){ui.shelf[id]=!ui.shelf[id];render()}
    else if(a==='ob'){var nx=ui.ob+(+id); if(ui.ob===2&&nx===3){build();save()} ui.ob=Math.max(0,Math.min(3,nx));render();window.scrollTo(0,0)}
    else if(a==='finish'){if(!Object.keys(state.checks).length)state.start=key(now); state.setup=true;ui.tab='today';ui.week=null;ui.ob=0;commit();window.scrollTo(0,0)}
  });
  document.addEventListener('input',function(e){ if(e.target.id==='new-p')ui.newP=e.target.value; });
  document.addEventListener('change',function(e){
    var t=e.target, ed=t.dataset&&t.dataset.edit, v=(t.value||'').trim();
    if(readOnly)return;
    if(t.id==='new-cat'){ui.newCat=t.value;return}
    if(t.id==='rest'){state.rest=+t.value||0;commit();return}
    if(t.id==='cmp-a'){ui.cmpA=t.value;render();return}
    if(t.id==='cmp-b'){ui.cmpB=t.value;render();return}
    if(ed==='p'){var p=prod(t.dataset.id); if(p){p.p=v.slice(0,40);save()} return}
    if(ed==='name'){state.name=v.slice(0,20);save();return}
    if(t.id==='start'&&/^\d{4}-\d{2}-\d{2}$/.test(t.value)){state.start=t.value;ui.week=null;ui.day=null;commit()}
  });

  /* ---------- backup: one file with the routine, check marks and photos ---------- */
  function exportData(){
    Promise.all([tx('readonly',function(o){return o.getAll()}),tx('readonly',function(o){return o.getAll()},'prod')]).catch(function(){return [[],[]]}).then(function(r){
      var name='rota-backup-'+key(new Date())+'.json', text=JSON.stringify({rota:1,saved:key(new Date()),state:state,photos:r[0]||[],products:r[1]||[]});
      var file=null; try{file=new File([text],name,{type:'application/json'})}catch(e){}
      if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file]}).then(function(){ui.backupMsg='Backup saved.';render()}).catch(function(){});
        return;
      }
      var a=document.createElement('a'), url=URL.createObjectURL(new Blob([text],{type:'application/json'}));
      a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(url)},8000);
      ui.backupMsg='Backup saved as '+name+'.'; render();
    });
  }
  document.getElementById('restore').addEventListener('change',function(){
    var inp=this, f=inp.files&&inp.files[0]; inp.value=''; if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      var d=null; try{d=JSON.parse(rd.result)}catch(e){}
      if(!d||d.rota!==1||!d.state||typeof d.state!=='object'){ui.backupMsg='That file is not a Rota backup.';render();return}
      adopt(d.state);
      var ph=(Array.isArray(d.photos)?d.photos:[]).filter(function(x){return x&&/^\d{4}-\d{2}-\d{2}$/.test(x.d)&&okImg(x.u)}).slice(0,120).map(function(x){return {d:x.d,u:x.u}});
      var pr=(Array.isArray(d.products)?d.products:[]).filter(function(x){return x&&typeof x.id==='string'&&okImg(x.u)}).slice(0,40).map(function(x){return {id:x.id.slice(0,24),u:x.u}});
      Promise.all([tx('readwrite',function(o){ph.forEach(function(x){o.put(x)})}),tx('readwrite',function(o){pr.forEach(function(x){o.put(x)})},'prod')]).catch(function(){})
        .then(function(){ui.backupMsg='Restored your backup'+(d.saved?' from '+nice(parse(String(d.saved)))+'.':'.');ui.week=null;ui.day=null;save();return loadPhotos()});
    };
    rd.readAsText(f);
  });

  /* ---------- saving ---------- */
  function save(){ try{localStorage.setItem('skin-rotation',JSON.stringify(state))}catch(e){} flush(); }
  function commit(){ render(); save(); }
  async function flush(){
    if(!ref||readOnly)return;
    if(writing){dirty=true;return}
    writing=true;
    do{ dirty=false;
      try{ await ref.set(JSON.parse(JSON.stringify(state))); syncMsg='Saved to your account'; }
      catch(e){ if(e&&e.code==='invalid_argument'){readOnly=true;syncMsg='View only on this account';render()} else syncMsg='Could not save just now. Your next tap will retry.'; break; }
    }while(dirty);
    writing=false;
  }
  function obj(o){return (o&&typeof o==='object'&&!Array.isArray(o))?JSON.parse(JSON.stringify(o)):{}}
  /* Data saved by the earlier version of this app is carried over, with its products and check marks intact. */
  function migrate(d){
    var st=obj(d.steps), sh=obj(d.shop);
    var prods=herProducts().map(function(p){var o=st[p.id]||{}; if(typeof o.p==='string'&&o.p)p.p=o.p; if(typeof o.off==='boolean')p.on=!o.off; else if(p.id==='oc')p.on=!!sh.oilcl; return p});
    (Array.isArray(d.custom)?d.custom:[]).forEach(function(c){if(c&&typeof c.id==='string'&&typeof c.n==='string')prods.push({id:c.id,cat:'se',n:c.n,p:c.p,w:c.w,on:true,x:1})});
    return {v:2,setup:true,extras:true,start:d.start,ramp:2,goals:[],name:typeof d.name==='string'?d.name:MY_NAME,theme:d.theme,products:prods,checks:d.checks,miles:d.miles,shop:d.shop,feel:{},batch:d.batch};
  }
  function clean(d){
    var f=fresh();
    return {v:2,setup:!!d.setup,extras:!!d.extras,start:/^\d{4}-\d{2}-\d{2}$/.test(d.start)?d.start:f.start,ramp:[2,3,4].indexOf(+d.ramp)>=0?+d.ramp:2,
      goals:Array.isArray(d.goals)?d.goals.filter(function(g){return GOALS[g]}):[],name:typeof d.name==='string'?d.name.slice(0,20):'',
      theme:THEME_IDS[d.theme]?d.theme:(d.theme==='day'?'bone':'stone'),rest:(+d.rest>=0&&+d.rest<=6)?Math.floor(+d.rest):0,
      products:Array.isArray(d.products)?d.products.filter(function(p){return p&&typeof p.id==='string'&&CATS[p.cat]}).slice(0,24).map(function(p){
        return {id:p.id.slice(0,24),cat:p.cat,n:typeof p.n==='string'?p.n.slice(0,30):'',p:String(p.p||'').slice(0,40),w:WHEN[p.w]?p.w:'',on:p.on!==false,x:p.x?1:0,since:/^\d{4}-\d{2}-\d{2}$/.test(p.since)?p.since:'',max:Math.max(0,Math.min(7,Math.floor(+p.max||0))),used:!!p.used}}):[],
      checks:obj(d.checks),miles:obj(d.miles),shop:obj(d.shop),feel:obj(d.feel),batch:(+d.batch>=50&&+d.batch<=1000)?+d.batch:200};
  }
  function adopt(d){ if(d&&typeof d==='object')state=clean(d.v===2?d:migrate(d)); }

  var h=(location.hash||'').slice(1); if(h)ui.tab=h;
  try{var saved=localStorage.getItem('skin-rotation'); if(saved)adopt(JSON.parse(saved))}catch(e){}
  syncMsg='Saved on this phone';
  render();
  loadPhotos();

  (window.claude&&window.claude.use?window.claude.use('db'):Promise.resolve(null)).then(function(db){
    if(!db)return;
    ref=db.doc('tracker/state');
    ref.onSnapshot(function(snap){
      if(writing||snap.metadata.hasPendingWrites)return;
      syncMsg='Saved to your account';
      if(snap.exists){adopt(snap.data());ui.week=null;ui.day=null}
      render();
    },function(){ ref=null; syncMsg='Saved on this phone'; });
  }).catch(function(){});
})();
</script>
