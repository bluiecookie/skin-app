<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AuraSkin">
<meta name="theme-color" content="#120E17">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>AuraSkin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400;1,6..96,600&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a night-time phone app. Deep plum ground with two faint gem glows, frosted violet cards with a 1px lit edge.
   Each pillar owns a gem: amethyst for face, teal for body, a blend for hair. Cyan is reserved for live feedback and timers. */
:root{
  color-scheme:dark;
  --bg:#120E17; --bg2:#181320; --card:#1E1A26; --card2:#272132; --line:rgba(130,90,160,.2); --line2:rgba(130,90,160,.38);
  --fg:#F3EEF7; --muted:#B9AFC7; --faint:#8E849B;
  --ame:#7C3AED; --ame-l:#B49CFF; --teal:#0D9488; --teal-l:#5FD6C8; --cyan:#2DD4BF;
  --warn:#F2B66D; --bad:#F38BA8; --ink:#120E17;
  --pc:var(--ame); --pl:var(--ame-l);
  --serif:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --sans:"Instrument Sans","Helvetica Neue","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:linear-gradient(180deg,var(--bg),var(--bg2)) fixed;color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60% 34% at 8% 0%,rgba(124,58,237,.30),transparent 70%),radial-gradient(55% 36% at 100% 100%,rgba(13,148,136,.22),transparent 70%),radial-gradient(50% 30% at 100% 30%,color-mix(in srgb,var(--pc) 22%,transparent),transparent 70%)}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding-inline:18px;padding-block:12px calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3,p,ul,ol{margin:0;padding:0} ul,ol{list-style:none}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,10vw,44px);line-height:1.04;letter-spacing:-.02em;text-wrap:balance}
h1 em{font-style:italic;color:var(--pl)}
h2{font-family:var(--serif);font-weight:400;font-size:23px;line-height:1.15}
h3{font-size:15.5px;font-weight:600}
.sub{color:var(--muted);font-size:14px}
.tiny{font-size:12.5px;color:var(--faint)}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-variant-numeric:tabular-nums lining-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.card{background:color-mix(in srgb,var(--card) 84%,transparent);border:1px solid var(--line);border-radius:22px;padding:18px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);min-width:0}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.brand{font-family:var(--serif);font-size:22px;letter-spacing:-.01em}
.brand i{font-style:italic;color:var(--ame-l)}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.icon.l{margin-left:-12px} .icon.r{margin-right:-12px}
.rowh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:600;background:var(--card2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 35%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.chip.buy{color:var(--ame-l);border-color:var(--line2)}
.chip.pc{color:var(--pl);border-color:color-mix(in srgb,var(--pl) 40%,transparent)}

/* Hub */
.pillar{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:14px;align-items:center;width:100%;padding:20px;border-radius:24px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 84%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.pillar::before{content:"";position:absolute;right:-60px;top:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--g1),transparent 68%);opacity:.55}
.pillar>*{position:relative}
.pillar h2{font-size:32px;font-style:italic}
.pillar .next{margin-top:6px;color:var(--muted);font-size:14px}
.pillar .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.ring{position:relative;width:64px;height:64px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{stroke:var(--card2)} .ring .p{transition:stroke-dashoffset .7s cubic-bezier(.3,.8,.3,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-weight:400;font-size:19px}
.alerts li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:11px 0;font-size:14px;color:var(--muted)}
.alerts li+li{border-top:1px solid var(--line)}
.alerts li.warn svg{color:var(--warn)} .alerts li.bad svg{color:var(--bad)} .alerts li.ok svg{color:var(--cyan)} .alerts li.tip svg{color:var(--ame-l)}
.alerts li.warn,.alerts li.bad{color:var(--fg)}

/* Pillar page */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 20px;border:1px solid var(--line2);background:linear-gradient(140deg,color-mix(in srgb,var(--pc) 38%,var(--card)),var(--card) 70%)}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--pl) 55%,transparent),transparent 70%)}
.hero>*{position:relative;z-index:1}
.hero .big{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(44px,13vw,60px);line-height:.95;letter-spacing:-.03em;margin:8px 0 10px}
.hero .why{font-family:var(--serif);font-style:italic;font-size:16.5px;line-height:1.4;color:var(--fg);opacity:.9;max-width:34ch}
.hero .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:99px;background:color-mix(in srgb,var(--card) 84%,transparent);border:1px solid var(--line)}
.seg button{padding:10px 6px;border-radius:99px;text-align:center;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--pc);color:#fff;box-shadow:0 0 18px color-mix(in srgb,var(--pc) 45%,transparent)}
.steps{display:flex;flex-direction:column;gap:9px}
.step{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 14px;border-radius:18px;background:color-mix(in srgb,var(--card) 84%,transparent);border:1px solid var(--line)}
.step .what b{display:block;font-weight:600;font-size:15px}
.step .what small{display:block;color:var(--muted);font-size:13px}
.step .what .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tick{width:30px;height:30px;border-radius:50%;border:1.6px solid var(--line2);display:grid;place-items:center;color:transparent;transition:background .2s,box-shadow .2s}
.tick svg{width:16px;height:16px;stroke-width:2.4}
.step.done{border-color:color-mix(in srgb,var(--pc) 40%,transparent)}
.step.done .tick{background:var(--pc);border-color:transparent;color:#fff;box-shadow:0 0 14px color-mix(in srgb,var(--pc) 60%,transparent)}
.step.done .what b{color:var(--faint)}
.timerbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:99px;border:1px solid color-mix(in srgb,var(--cyan) 40%,transparent);color:var(--cyan);font-size:12.5px;font-weight:700}
.timerbtn svg{width:15px;height:15px}
.timerbtn.on{background:var(--cyan);color:var(--ink)}
.note{font-family:var(--serif);font-style:italic;font-size:16.5px;line-height:1.4;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dayb{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 0 8px;border-radius:14px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 70%,transparent);font-size:10.5px;font-weight:700;color:var(--muted);width:100%}
.dayb b{font-family:var(--serif);font-weight:400;font-size:18px;color:var(--fg)}
.dayb .k{font-size:10px;letter-spacing:.04em;text-transform:uppercase}
.dayb.act{background:color-mix(in srgb,var(--pc) 30%,var(--card));border-color:color-mix(in srgb,var(--pl) 45%,transparent);color:var(--fg)}
.dayb.today{outline:1.5px solid var(--cyan);outline-offset:1px}
.dayb[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.feel{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:8px 13px;border-radius:99px;border:1px solid var(--line2);font-size:13px;font-weight:600;color:var(--muted)}
.pill[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 0;border-radius:99px;font-weight:700;font-size:14px;color:#fff;background:linear-gradient(120deg,var(--ame),var(--teal));box-shadow:0 8px 24px rgba(124,58,237,.3)}
.btn.ghost{background:transparent;box-shadow:none;border:1px solid var(--line2);color:var(--fg)}
.btn.sm{width:auto;padding:9px 16px;font-size:13px}
.btn:disabled{opacity:.4}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.link{color:var(--cyan);font-weight:700;font-size:13px;padding:6px 0}

/* Shelf */
.prod{display:grid;grid-template-columns:42px minmax(0,1fr) 20px;gap:12px;align-items:center;width:100%;padding:13px 0}
.prod+.prod{border-top:1px solid var(--line)}
.gem{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-family:var(--serif);font-style:italic;font-size:20px;color:#fff;background:linear-gradient(140deg,var(--g1),var(--g2))}
.prod.off{opacity:.55}
.prod b{display:block;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.search{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--card) 84%,transparent);border:1px solid var(--line2)}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:15px}
.field{display:flex;flex-direction:column;gap:7px}
.field>span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.inp{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);font-size:15px;appearance:none;-webkit-appearance:none}
.inp:focus{outline:none;border-color:var(--cyan)}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.frow:first-child{border-top:0}
.frow .inp{max-width:170px}
.sw{width:48px;height:29px;border-radius:99px;background:var(--card2);border:1px solid var(--line2);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:23px;height:23px;border-radius:50%;background:var(--muted);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--teal);border-color:transparent}
.sw[aria-checked="true"]::after{transform:translateX(19px);background:#fff}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:18px}
.stepper b{min-width:56px;text-align:center;font-family:var(--serif);font-weight:400;font-size:19px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.days button{aspect-ratio:1;max-width:44px;width:100%;border-radius:50%;justify-self:center;text-align:center;border:1px solid var(--line2);font-size:12px;font-weight:700;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--pc);border-color:transparent;color:#fff}

/* Journal */
.rate{display:flex;gap:6px}
.rate button{flex:1;padding:10px 0;border-radius:12px;border:1px solid var(--line2);text-align:center;font-family:var(--serif);font-size:18px;color:var(--muted)}
.rate button[aria-pressed="true"]{background:var(--pc);border-color:transparent;color:#fff}
.spark{width:100%;height:70px;display:block}
textarea.inp{min-height:80px;resize:vertical}
.cmp{position:relative;aspect-ratio:3/4;border-radius:20px;overflow:hidden;background:var(--card);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none;pointer-events:none}
.cmp .h{position:absolute;top:0;bottom:0;width:2px;background:var(--cyan);transform:translateX(-1px);pointer-events:none}
.cmp .h::after{content:"";position:absolute;top:50%;left:50%;width:34px;height:34px;border-radius:50%;background:var(--cyan);transform:translate(-50%,-50%);box-shadow:0 0 18px var(--cyan)}
.lbl{position:absolute;top:10px;padding:4px 10px;border-radius:99px;background:rgba(18,14,23,.7);font-size:11px;font-weight:700}
.lbl.l{left:10px} .lbl.r{right:10px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:2px}
.thumbs button{flex:none;width:58px;text-align:center}
.thumbs img{width:58px;height:76px;object-fit:cover;border-radius:12px;display:block;border:2px solid transparent}
.thumbs button[aria-pressed="true"] img{border-color:var(--cyan)}
.thumbs small{font-size:11px;color:var(--muted)}

/* Onboarding */
.ob{display:flex;flex-direction:column;gap:20px;padding-bottom:90px}
.wordmark{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(58px,19vw,92px);line-height:.92;letter-spacing:-.04em;margin-top:9vh;background:linear-gradient(120deg,#F3EEF7,var(--ame-l) 45%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:11px 15px;border-radius:16px;border:1px solid var(--line2);font-weight:600;font-size:14px;color:var(--muted);background:color-mix(in srgb,var(--card) 70%,transparent)}
.opt[aria-pressed="true"]{color:#fff;border-color:transparent;background:linear-gradient(120deg,var(--ame),var(--teal))}
.cta{position:fixed;z-index:6;left:0;right:0;bottom:0;padding:24px 18px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg2) 38%)}
.cta .btn{max-width:484px;margin:0 auto}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:4px;border-radius:2px;background:var(--card2)}
.dots i.on{background:var(--cyan)}

/* Dock and timer */
.dock{position:fixed;z-index:5;left:0;right:0;bottom:0;padding:6px 14px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(18,14,23,.86);border-top:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.dock div{display:grid;grid-template-columns:repeat(4,1fr);max-width:520px;margin:0 auto}
.dock button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;font-size:11px;font-weight:600;color:var(--faint)}
.dock button[aria-current="page"]{color:var(--fg)}
.dock button[aria-current="page"] svg{color:var(--cyan);filter:drop-shadow(0 0 6px var(--cyan))}
.timer{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;padding:10px 12px 10px 18px;border-radius:99px;background:var(--cyan);color:var(--ink);font-weight:700;box-shadow:0 10px 30px rgba(45,212,191,.45);white-space:nowrap}
.timer b{font-family:var(--serif);font-size:20px;font-weight:600}
.timer button{padding:6px 12px;border-radius:99px;background:rgba(18,14,23,.15);font-size:12.5px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<main id="app"></main>
<nav class="dock" id="docknav" aria-label="Sections"><div id="dock"></div></nav>
<div class="timer" id="timer" hidden></div>
<input type="file" accept="image/*" id="shot" hidden>
<input type="file" accept="application/json,.json" id="restore" hidden>

<script>
(function(){
  var PERSONAL=false, MY_NAME='';
  var app=document.getElementById('app'), dock=document.getElementById('dock'), docknav=document.getElementById('docknav'), timerEl=document.getElementById('timer');
  var ref=null, writing=false, dirty=false, readOnly=false;

  /* ---------- small helpers ---------- */
  var P={
    home:'<path d="M4 11l8-6.5 8 6.5V20H4z"/><path d="M10 20v-5h4v5"/>',
    shelf:'<path d="M4 5h16M4 12h16M4 19h16M7 5v14M17 5v14"/>',
    book:'<path d="M5 4.5h11a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>',
    user:'<circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1-4 4-5.5 7-5.5s6 1.5 7 5.5"/>',
    check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>', left:'<path d="M14.5 6l-6 6 6 6"/>', right:'<path d="M9.5 6l6 6-6 6"/>',
    alert:'<path d="M12 4l9 15.5H3zM12 10v4.5M12 17v.2"/>', spark:'<path d="M12 3.5c.6 4.6 3.3 7.3 8 8-4.7.7-7.4 3.4-8 8-.6-4.6-3.3-7.3-8-8 4.7-.7 7.4-3.4 8-8z"/>',
    clock:'<circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 2M9.5 3.5h5"/>', plus:'<path d="M12 5v14M5 12h14"/>', search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>',
    cam:'<path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>', trash:'<path d="M5 7h14M9 7V4.5h6V7M7 7l1 12.5h8L17 7"/>', tune:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'
  };
  function ic(n){return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+P[n]+'</svg>'}
  function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function parse(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2])}
  function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
  function days(d){return Math.round(parse(key(d)).getTime()/864e5)}
  var isDate=function(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)};
  var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], DOWL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function nice(d){return MON[d.getMonth()]+' '+d.getDate()}
  function today(){return new Date()}

  /* ---------- the three pillars and the product types inside them ---------- */
  var AREAS={
    face:{n:'Face',g1:'#7C3AED',g2:'#B49CFF',pc:'#7C3AED',pl:'#B49CFF',slots:[['am','Morning'],['pm','Evening']]},
    body:{n:'Body',g1:'#0D9488',g2:'#5FD6C8',pc:'#0D9488',pl:'#5FD6C8',slots:[['am','Morning'],['pm','After shower']]},
    hair:{n:'Hair',g1:'#7C3AED',g2:'#2DD4BF',pc:'#5B4BD6',pl:'#7FE3D6',slots:[['wash','Wash day'],['night','Night']]}
  };
  var TYPES={

      A.res=A.hits.length?A.hits.map(function(h,i){return '<button class="prod" data-act="hit" data-id="'+i+'"><span class="gem" style="--g1:#7C3AED;--g2:#2DD4BF">'+esc(h.name.charAt(0))+'</span><span><span class="tiny">'+TYPES[h.t].n+(h.pao?' · lasts '+h.pao+' months':'')+'</span><b>'+esc(h.name)+'</b></span>'+ic('plus')+'</button>'}).join('')
        :'<p class="tiny">No match in the database. Enter it yourself below.</p>';render();
    }).catch(function(){A.res='<p class="tiny">The lookup could not reach the database. Check your connection, or enter it yourself below.</p>';render()});
  }

  /* ---------- backup ---------- */
  function exportData(){tx('readonly',function(o){return o.getAll()}).catch(function(){return []}).then(function(ph){
    var name='auraskin-backup-'+key(today())+'.json', text=JSON.stringify({aura:1,saved:key(today()),state:state,photos:ph||[]}), file=null;
    try{file=new File([text],name,{type:'application/json'})}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).then(function(){ui.bmsg='Backup saved.';render()}).catch(function(){});return}
    var a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},8000);ui.bmsg='Backup saved as '+name+'.';render()})}
  document.getElementById('restore').addEventListener('change',function(){var inp=this,f=inp.files&&inp.files[0];inp.value='';if(!f)return;var rd=new FileReader();
    rd.onload=function(){var d=null;try{d=JSON.parse(rd.result)}catch(e){}if(!d||d.aura!==1||!d.state){ui.bmsg='That file is not an AuraSkin backup.';render();return}
      adopt(d.state);var ph=(Array.isArray(d.photos)?d.photos:[]).filter(function(x){return x&&isDate(x.d)&&typeof x.u==='string'&&x.u.indexOf('data:image/')===0}).slice(0,200);
      tx('readwrite',function(o){ph.forEach(function(x){o.put({d:x.d,u:x.u})})}).catch(function(){}).then(function(){ui.bmsg='Backup restored.';save();return loadPhotos()})};rd.readAsText(f)});

  /* ---------- saving ---------- */
  function save(){try{localStorage.setItem('auraskin',JSON.stringify(state))}catch(e){}flush()}
  function commit(){render();save()}
  async function flush(){if(!ref||readOnly)return;if(writing){dirty=true;return}writing=true;
    do{dirty=false;try{await ref.set(JSON.parse(JSON.stringify(state)))}catch(e){if(e&&e.code==='invalid_argument')readOnly=true;break}}while(dirty);writing=false}
  function obj(o){return o&&typeof o==='object'&&!Array.isArray(o)?JSON.parse(JSON.stringify(o)):{}}
  function cleanPh(ph){if(!Array.isArray(ph))return undefined;var o=ph.filter(function(f){return f&&isDate(f.from)}).slice(0,8).map(function(f){var r={from:f.from};if(Array.isArray(f.days))r.days=f.days.map(Number).filter(function(x){return x>=0&&x<=6});if(+f.every>1)r.every=Math.min(8,Math.floor(+f.every));return r});return o.length?o:undefined}
  function adopt(d){
    if(!d||typeof d!=='object'||d.v!==3)return;
    var b=blank(), h=obj(d.hair), pr=obj(d.profile);
    state={v:3,setup:!!d.setup,name:typeof d.name==='string'?d.name.slice(0,20):'',start:isDate(d.start)?d.start:b.start,rest:(+d.rest>=0&&+d.rest<=6)?Math.floor(+d.rest):0,
      profile:Object.assign(b.profile,{face:Array.isArray(pr.face)?pr.face:[],body:Array.isArray(pr.body)?pr.body:[],hair:Array.isArray(pr.hair)?pr.hair:[],sens:+pr.sens||0,tex:String(pr.tex||''),por:String(pr.por||''),washes:+pr.washes||2,styles:Array.isArray(pr.styles)?pr.styles:[]}),
      hair:{washDays:Array.isArray(h.washDays)?h.washDays.map(Number).filter(function(x){return x>=0&&x<=6}):[],installed:isDate(h.installed)?h.installed:null,takedown:isDate(h.takedown)?h.takedown:null,trim:isDate(h.trim)?h.trim:null},
      products:(Array.isArray(d.products)?d.products:[]).filter(function(p){return p&&typeof p.id==='string'&&TYPES[p.t]}).slice(0,80).map(function(p){
        return {id:p.id.slice(0,30),t:p.t,name:String(p.name||'').slice(0,60),label:p.label?String(p.label).slice(0,40):undefined,note:p.note?String(p.note).slice(0,80):undefined,on:p.on!==false,buy:!!p.buy,
          slot:['am','pm','wash','night'].indexOf(p.slot)>=0?p.slot:undefined,opened:isDate(p.opened)?p.opened:'',pao:p.pao!=null&&+p.pao>=0?Math.min(60,Math.floor(+p.pao)):undefined,wait:p.wait!=null&&+p.wait>=0?Math.min(60,Math.floor(+p.wait)):undefined,ph:cleanPh(p.ph)}}),
      checks:obj(d.checks),feel:obj(d.feel),journal:obj(d.journal)};
  }
  /* Someone who used the earlier Rota app gets Al's plan carried over once. */
  function fromRota(){try{var o=JSON.parse(localStorage.getItem('skin-rotation')||'null');if(!o||!Array.isArray(o.products))return false;var ids={};o.products.forEach(function(p){ids[p&&p.id]=1});
    if(!(ids.az&&ids.ex))return false;var s=herState();s.name=typeof o.name==='string'?o.name:'';state=s;return true}catch(e){return false}}

  var loaded=false;
  try{var sv=localStorage.getItem('auraskin');if(sv){adopt(JSON.parse(sv));loaded=true}}catch(e){}
  if(!loaded&&fromRota())save();
  render(); loadPhotos();
  (window.claude&&window.claude.use?window.claude.use('db'):Promise.resolve(null)).then(function(db){if(!db)return;ref=db.doc('aura/state');
    ref.onSnapshot(function(s){if(writing||s.metadata.hasPendingWrites)return;if(s.exists){adopt(s.data());render()}else save()},function(){ref=null})}).catch(function(){});
})();
