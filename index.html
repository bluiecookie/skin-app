<title>Skin Rotation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a phone app. One screen per tab, a floating dock at the bottom, glass cards over two soft glows. Single dark look by choice. */
:root{
  color-scheme:dark;
  --bg:#130d17; --glow-a:#ff9d7a; --glow-b:#a983ff;
  --fg:#fcf4f1; --muted:#bbaab8; --faint:#8a7a88;
  --card:rgba(255,255,255,.06); --card-2:rgba(255,255,255,.09); --line:rgba(255,255,255,.11);
  --peach:#ffb48c; --rose:#ff8fa3;
  --lilac:#c9abff;   /* exfoliation nights */
  --gold:#ffd590;    /* azelaic nights */
  --mint:#a8e6c4;    /* recovery nights */
  --ink:#2a1420;     /* text on a filled accent */
  --dock:rgba(36,26,42,.82); --shadow:rgba(0,0,0,.45);
  --display:"Fraunces","Iowan Old Style",Georgia,serif;
  --body:"Plus Jakarta Sans","Avenir Next","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60% 38% at 12% 0%,color-mix(in srgb,var(--glow-a) 34%,transparent),transparent 70%),
             radial-gradient(55% 40% at 100% 38%,color-mix(in srgb,var(--glow-b) 26%,transparent),transparent 72%),
             radial-gradient(70% 40% at 20% 100%,color-mix(in srgb,var(--rose) 16%,transparent),transparent 70%)}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding-inline:16px;padding-block:22px calc(118px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3,p{margin:0}
h1{font-family:var(--display);font-weight:500;font-size:32px;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:italic;color:var(--peach)}
h2{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.15}
h3{font-size:15px;font-weight:600}
.sub{color:var(--muted);font-size:13.5px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700}
.num{font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--peach);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px;background:var(--card-2);color:var(--muted);align-self:flex-start}
.hello{display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);min-width:0}
.t-exf{color:var(--lilac)} .t-aza{color:var(--gold)} .t-rec{color:var(--mint)}
.b-exf{background:var(--lilac)} .b-aza{background:var(--gold)} .b-rec{background:var(--mint)}

/* Today */
.hero{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 12px color-mix(in srgb,var(--peach) 55%,transparent))}
.ring .track{stroke:var(--card-2)} .ring .bar{stroke:url(#grad);transition:stroke-dashoffset .6s cubic-bezier(.3,.8,.3,1)}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-family:var(--display);font-size:28px;font-weight:600;line-height:1}
.ring span{font-size:11px;color:var(--muted);margin-top:3px}
.hero .meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.streak{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;font-weight:600;color:var(--peach)}
.streak svg{width:16px;height:16px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.seg button{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 0;border-radius:99px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:linear-gradient(120deg,var(--peach),var(--rose));color:var(--ink)}
.seg svg{width:18px;height:18px}

.steps{display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:46px minmax(0,1fr) 30px;gap:14px;align-items:center;width:100%;padding:12px 14px;border-radius:22px;background:var(--card);border:1px solid var(--line);transition:background .2s,opacity .2s}
.step .ico{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:var(--card-2);color:var(--peach)}
.step .tick{width:30px;height:30px;border-radius:50%;border:1.6px solid var(--line);display:grid;place-items:center;color:transparent}
.step .tick svg{width:16px;height:16px;stroke-width:2.4}
.step[aria-pressed="true"]{background:color-mix(in srgb,var(--peach) 13%,transparent);border-color:color-mix(in srgb,var(--peach) 35%,transparent)}
.step[aria-pressed="true"] .tick{background:linear-gradient(120deg,var(--peach),var(--rose));border-color:transparent;color:var(--ink)}
.step[aria-pressed="true"] h3{color:var(--muted)}
.step.key .ico{color:var(--ink)}
.tip{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted);padding:2px 6px}
.tip svg{width:18px;height:18px;margin-top:1px;color:var(--peach)}

/* Week */
.bar-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.arrows{display:flex;gap:8px}
.arrows button{width:40px;height:40px;border-radius:50%;background:var(--card-2);display:grid;place-items:center}
.arrows button:disabled{opacity:.3}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dayb{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0 9px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.dayb small{font-size:11px;color:var(--muted);font-weight:600}
.dayb b{font-family:var(--display);font-size:19px;font-weight:600;line-height:1}
.dayb .dot{width:7px;height:7px;border-radius:50%}
.dayb .ap{display:flex;gap:3px}
.dayb .ap i{width:9px;height:4px;border-radius:2px;background:var(--card-2)}
.dayb .ap i.on{background:var(--peach)}
.dayb[aria-pressed="true"]{background:var(--card-2);border-color:var(--peach)}
.dayb.today small{color:var(--peach)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);justify-content:center}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.big{display:flex;align-items:center;justify-content:center;gap:9px;padding:15px 0;border-radius:20px;background:var(--card-2);font-weight:600}
.big[aria-pressed="true"]{background:linear-gradient(120deg,var(--peach),var(--rose));color:var(--ink)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.pills span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:6px 11px 6px 8px;border-radius:99px;background:var(--card-2);color:var(--muted)}
.pills svg{width:15px;height:15px}
.pills .key{color:var(--fg)}

/* Progress */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{padding:16px 10px;text-align:center}
.tile b{display:block;font-family:var(--display);font-size:30px;font-weight:600;line-height:1.05}
.tile span{font-size:11.5px;color:var(--muted)}
.map{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;margin-top:14px}
.map i{aspect-ratio:1;border-radius:50%;background:var(--card-2)}
.map i.l1{background:color-mix(in srgb,var(--peach) 45%,transparent)}
.map i.l2{background:linear-gradient(135deg,var(--peach),var(--rose));box-shadow:0 0 8px color-mix(in srgb,var(--peach) 50%,transparent)}
.map i.now{outline:2px solid var(--fg);outline-offset:2px}
.line{display:flex;flex-direction:column;margin-top:10px}
.mile{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:9px 0;position:relative}
.mile .node{width:40px;height:40px;border-radius:50%;background:var(--card-2);display:grid;place-items:center;color:var(--muted);position:relative;z-index:1}
.mile .node svg{width:18px;height:18px}
.mile:not(:last-child)::after{content:"";position:absolute;left:19px;top:49px;bottom:-9px;width:2px;background:var(--line)}
.mile[aria-pressed="true"] .node{background:linear-gradient(120deg,var(--peach),var(--rose));color:var(--ink)}
.mile[aria-pressed="true"] h3{color:var(--muted)}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13.5px;color:var(--muted)}
.field input{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:7px 10px}
.sync{text-align:center;font-size:12px;color:var(--faint)}

/* Shop */
.meter{height:8px;border-radius:99px;background:var(--card-2);overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--peach),var(--rose));transition:width .4s}
.group{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:30px minmax(0,1fr);gap:14px;align-items:center;width:100%;padding:13px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.item .tick{width:30px;height:30px;border-radius:50%;border:1.6px solid var(--line);display:grid;place-items:center;color:transparent}
.item .tick svg{width:16px;height:16px;stroke-width:2.4}
.item[aria-pressed="true"] .tick{background:linear-gradient(120deg,var(--peach),var(--rose));border-color:transparent;color:var(--ink)}
.item[aria-pressed="true"] h3{text-decoration:line-through;color:var(--muted)}

/* Butter */
.stack{display:flex;height:22px;border-radius:99px;overflow:hidden;gap:2px;margin:16px 0 6px}
.stack i{display:block;min-width:4px}
.ing{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.ing:last-of-type{border-bottom:0}
.ing i{width:12px;height:12px;border-radius:50%}
.ing .pct{color:var(--muted);font-size:13px;min-width:44px;text-align:right}
.ing b{min-width:62px;text-align:right;font-weight:600}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:38px;height:38px;border-radius:50%;background:var(--card-2);display:grid;place-items:center;font-size:20px;font-weight:500}
.stepper b{font-family:var(--display);font-size:22px;font-weight:600;min-width:72px;text-align:center}
.how{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none;counter-reset:n}
.how li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:center;font-size:14px;counter-increment:n}
.how li::before{content:counter(n);width:28px;height:28px;border-radius:50%;background:var(--card-2);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--peach)}

/* Dock */
.dock{position:fixed;z-index:5;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;padding-inline:12px;pointer-events:none}
.dock div{pointer-events:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;width:100%;max-width:440px;padding:6px;border-radius:30px;background:var(--dock);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 12px 32px var(--shadow)}
.dock button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border-radius:24px;font-size:10.5px;font-weight:600;color:var(--faint)}
.dock button[aria-current="page"]{background:var(--card-2);color:var(--peach)}
/* Settings */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.round{width:40px;height:40px;border-radius:50%;background:var(--card-2);display:grid;place-items:center;flex:none}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.theme{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;border-radius:20px;background:var(--card-2);border:1.6px solid transparent;font-size:12px;font-weight:600;text-align:center}
.theme i{width:44px;height:44px;border-radius:50%;border:1px solid var(--line)}
.theme[aria-pressed="true"]{border-color:var(--peach)}
.prod{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.prod:last-child{border-bottom:0}
.prod .ico{width:40px;height:40px;border-radius:14px;background:var(--card-2);display:grid;place-items:center;color:var(--peach)}
.prod label{font-size:12px;color:var(--muted);font-weight:600;display:block}
.txt{width:100%;background:transparent;border:0;border-bottom:1px dashed var(--line);padding:3px 0;font-size:15px;font-weight:600;border-radius:0}
.txt:focus{outline:none;border-bottom-color:var(--peach)}
.sw{width:46px;height:28px;border-radius:99px;background:var(--card-2);border:1px solid var(--line);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--fg);transition:transform .2s}
.sw[aria-checked="true"]{background:linear-gradient(120deg,var(--peach),var(--rose));border-color:transparent}
.sw[aria-checked="true"]::after{transform:translateX(18px);background:var(--ink)}
.add{display:grid;gap:10px;margin-top:14px}
.add .txt{border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:var(--card-2);font-weight:500}
.btn{padding:13px 0;border-radius:18px;text-align:center;font-weight:700;background:linear-gradient(120deg,var(--peach),var(--rose));color:var(--ink);width:100%}
.del{color:var(--muted);width:36px;height:36px;display:grid;place-items:center}
.field .txt{max-width:150px;text-align:right}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--peach)"/><stop offset="1" style="stop-color:var(--rose)"/></linearGradient></defs></svg>
<main id="app"></main>
<nav class="dock" aria-label="Sections"><div id="dock"></div></nav>

<script>
(function(){

  var ui={tab:'today',slot:new Date().getHours()<15?'am':'pm',week:null,day:null,recipe:'butter',frac:0,when:'am',newN:'',newP:''};

  function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  var BASE={bg:'#130d17','glow-a':'#ff9d7a','glow-b':'#a983ff',fg:'#fcf4f1',muted:'#bbaab8',faint:'#8a7a88',card:'rgba(255,255,255,.06)','card-2':'rgba(255,255,255,.09)',line:'rgba(255,255,255,.11)',

  var THEMES=[
    ['glow','Peach glow',{}],
    ['berry','Berry',{bg:'#170b12','glow-a':'#ff5f8f','glow-b':'#9a4dff',peach:'#ff9dbb',rose:'#d58cff',ink:'#2b0c1b',dock:'rgba(42,22,34,.82)'}],

    ['mint','Ocean mint',{bg:'#0b1514','glow-a':'#4fd1a5','glow-b':'#3a8fb5',peach:'#9eebc9',rose:'#6fd0d6',ink:'#082019',dock:'rgba(18,34,33,.82)'}],
    ['gold','Golden hour',{bg:'#15100a','glow-a':'#ffb347','glow-b':'#d9773c',peach:'#ffd590',rose:'#ffab6b',ink:'#2a1a06',dock:'rgba(38,29,18,.82)'}],

      peach:'#d9623c',rose:'#dd4f79',lilac:'#7a52d6',gold:'#a06500',mint:'#1f8a5b',ink:'#ffffff',dock:'rgba(255,255,255,.86)',shadow:'rgba(90,50,70,.22)'}]

    var ed=e.target.dataset&&e.target.dataset.edit, eid=e.target.dataset&&e.target.dataset.id, v=(e.target.value||'').trim();
    if(ed&&!readOnly){
      if(ed==='p'){var c=state.steps[eid]||{}; if(v&&v!==S[eid][3])c.p=v.slice(0,40); else delete c.p; if(Object.keys(c).length)state.steps[eid]=c; else delete state.steps[eid]}
      else if(ed==='cp'){state.custom.forEach(function(x){if(x.id===eid)x.p=v.slice(0,40)})}
      else if(ed==='name'){state.name=v.slice(0,20)}
      save(); return;
    }
    if(e.target.id==='start'&&/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)&&!readOnly){state.start=e.target.value;ui.week=null;ui.day=null;commit()}
  });

  function save(){ try{localStorage.setItem('skin-rotation',JSON.stringify(state))}catch(e){} flush(); }
  function commit(){ render(); save(); }
  async function flush(){
    if(!ref||readOnly)return;
    if(writing){dirty=true;return}
    writing=true;
    do{ dirty=false;
      try{ await ref.set(JSON.parse(JSON.stringify(state))); syncMsg='Saved to your account'; }
      catch(e){ if(e&&e.code==='invalid_argument'){readOnly=true;syncMsg='View only on this account';render()} else syncMsg='Could not save just now. Your next tap will retry.'; break; }
    }while(dirty);
    writing=false;
  }
  function obj(o){return (o&&typeof o==='object')?JSON.parse(JSON.stringify(o)):{}}
  function adopt(d){
    if(!d)return;
    state={start:/^\d{4}-\d{2}-\d{2}$/.test(d.start)?d.start:DEFAULT_START,checks:obj(d.checks),miles:obj(d.miles),shop:obj(d.shop),
      batch:(+d.batch>=50&&+d.batch<=1000)?+d.batch:200,
      theme:typeof d.theme==='string'?d.theme:'glow',steps:obj(d.steps),
      custom:Array.isArray(d.custom)?d.custom.filter(function(c){return c&&typeof c.id==='string'&&typeof c.n==='string'&&WHEN[c.w]}).slice(0,12).map(function(c){return {id:c.id,n:c.n.slice(0,30),p:String(c.p||'').slice(0,40),w:c.w}}):[],
      name:typeof d.name==='string'?d.name.slice(0,20):DEFAULT_NAME};
  }

  var h=(location.hash||'').slice(1); if(TABS.some(function(t){return t[0]===h}))ui.tab=h;
  try{var saved=localStorage.getItem('skin-rotation'); if(saved)adopt(JSON.parse(saved))}catch(e){}
  syncMsg='Saved on this phone';
  render();

  (window.claude&&window.claude.use?window.claude.use('db'):Promise.resolve(null)).then(function(db){
    if(!db)return;
    ref=db.doc('tracker/state');
    ref.onSnapshot(function(snap){
      if(writing||snap.metadata.hasPendingWrites)return;
      syncMsg='Saved to your account';
      if(snap.exists){adopt(snap.data());ui.week=null;ui.day=null}
      render();
    },function(){ ref=null; syncMsg='Saved on this phone'; });
  }).catch(function(){});
})();
</script>

<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}</script>
