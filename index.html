<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rota">
<meta name="theme-color" content="#fff3df">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Rota</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: a hand-made notebook with punch. Dotted paper, thick outlines, hard shadows and taped, slightly tilted cards.
   Tonight's card takes a palette color: the first for active nights, the second for rest, the third for exfoliation. */
:root{
  color-scheme:light;
  --c1:#6fa8ff; --c2:#cfe5ff; --c3:#a9b6ff; --done:#e3f0ff; --tape:rgba(169,182,255,.9); --on1:#151215;
  --ol:#151215; --txt:#151215; --paper:#fff3df; --card:#ffffff; --dots:rgba(60,40,20,.16); --red:#c0392b; --sub:#5a524c; --line:rgba(21,18,21,.14);
  --tone:var(--c1); --ontone:var(--on1);
  --font:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif; --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{margin:0;background-color:var(--paper);background-image:radial-gradient(var(--dots) 1px,transparent 1.2px);background-size:14px 14px;color:var(--txt);font-family:var(--font);font-size:15px;line-height:1.42;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding-inline:18px;padding-block:12px calc(112px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3,p,ul,ol{margin:0;padding:0} ul,ol{list-style:none}
h1{font-weight:800;font-size:clamp(36px,10vw,46px);line-height:.95;letter-spacing:-.045em;text-wrap:balance}
h1 em{font-family:var(--hand);font-style:normal;font-weight:700;letter-spacing:0;font-size:1.05em}
h2{font-weight:800;font-size:21px;line-height:1.1;letter-spacing:-.02em}
h3{font-size:15px;font-weight:700}
.sub{color:var(--sub);font-size:14px}
.tiny{font-size:12.5px;color:var(--sub)}
.eyebrow,.hand{font-family:var(--hand);font-weight:700;font-size:19px;line-height:1.1;color:var(--sub)}
.hand{color:var(--red);display:inline-block;transform:rotate(-6deg);font-size:18px}
.num{font-variant-numeric:tabular-nums lining-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:left}
:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.card{background:var(--card);border:2.5px solid var(--ol);border-radius:16px;box-shadow:4px 4px 0 var(--ol);padding:16px;min-width:0}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.bar .tiny{font-family:var(--hand);font-weight:700;font-size:19px;color:var(--txt)}
.brand{font-weight:800;font-size:22px;letter-spacing:-.04em;background:var(--ol);color:var(--paper);padding:1px 11px 4px;border-radius:10px;transform:rotate(-3deg)}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.icon.l{margin-left:-10px}
.rowh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:8px;font-size:11.5px;font-weight:700;background:var(--card);border:2px solid var(--ol);color:var(--txt);white-space:nowrap}
.chip.ok{background:var(--c2);color:#151215}
.chip.warn{background:#ffd48a;color:#151215}
.chip.bad{background:#ff9b9b;color:#151215}
.chip.buy{background:var(--c3);color:#151215}
.chip.pc{background:var(--c1);color:var(--on1)}

/* tone cards */
.pillar,.hero{position:relative;background:var(--tone);color:var(--ontone);border:3px solid var(--ol);border-radius:16px;box-shadow:6px 6px 0 var(--ol)}
.pillar{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;padding:22px 18px 22px 20px}
.pillar svg.i{width:28px;height:28px;stroke-width:2.6}
.pillar:nth-of-type(odd){transform:rotate(-.8deg)} .pillar:nth-of-type(even){transform:rotate(.7deg)}
.pillar .eyebrow,.hero .eyebrow{color:inherit;opacity:.85}
.pillar h2{font-size:44px;letter-spacing:-.05em;line-height:.9}
.pillar .next{margin-top:4px;font-size:13.5px;font-weight:500}
.pillar .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ring{position:relative;width:66px;height:66px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{stroke:currentColor;opacity:.2} .ring .p{stroke:currentColor;transition:stroke-dashoffset .7s cubic-bezier(.3,.8,.3,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:16px}
.hero{padding:20px 16px 16px;transform:rotate(-1.2deg);margin-top:8px}
.hero::before{content:"";position:absolute;top:-13px;left:40%;width:84px;height:24px;background:var(--tape);transform:rotate(4deg);border-left:1px dashed rgba(0,0,0,.08);border-right:1px dashed rgba(0,0,0,.08)}
.hero .big{font-weight:800;font-size:clamp(46px,14vw,58px);line-height:.85;letter-spacing:-.055em;margin:4px 0 10px}
.hero .why{font-size:13.5px;font-weight:500;max-width:36ch}
.hero .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.alerts li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:10px 0;font-size:14px}
.alerts li+li{border-top:2px dashed var(--line)}
.alerts li.warn svg,.alerts li.bad svg{color:var(--red)} .alerts li.tip svg{color:var(--sub)}
.alerts li.ok,.alerts li.tip{color:var(--sub)}

/* routine */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:var(--card);border:2.5px solid var(--ol)}
.seg button{padding:9px 6px;border-radius:10px;text-align:center;font-weight:800;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--ol);color:var(--paper)}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:11px;align-items:center;padding:10px 11px;background:var(--card);color:var(--txt);border:2.5px solid var(--ol);border-radius:14px;box-shadow:4px 4px 0 var(--ol)}
.step .what b{display:block;font-weight:800;font-size:15px;letter-spacing:-.01em}
.step .what small{display:block;font-size:12.5px;opacity:.78}
.step .what .tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:5px}
.tick{position:relative;width:28px;height:28px;border:2.5px solid currentColor;border-radius:8px}
.tick svg{display:none}
.step.done{background:var(--done);color:#151215}
.step.done .tick::after{content:"";position:absolute;left:5px;top:-10px;width:10px;height:21px;border-right:3.5px solid #e2574c;border-bottom:3.5px solid #e2574c;transform:rotate(40deg)}
.step.done .what b{text-decoration:line-through;text-decoration-thickness:2px}
.step.done .hand{color:#c0392b}
.timerbtn{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:10px;border:2px solid currentColor;font-size:12px;font-weight:800}
.timerbtn svg{width:15px;height:15px}
.timerbtn.on{background:var(--c1);color:var(--on1);border-color:var(--ol)}
.note{font-family:var(--hand);font-weight:700;font-size:21px;line-height:1.2;color:var(--sub)}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dayb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 5px;border-radius:10px;border:2px solid var(--ol);font-size:10px;font-weight:800;width:100%;color:#151215}
.dayb b{font-size:17px;line-height:1}
.dayb .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.02em}
.k-r{background:var(--c2)} .k-x{background:var(--c3)} .k-a{background:var(--c1);color:var(--on1)}
.dayb.today{box-shadow:3px 3px 0 var(--ol);transform:translate(-1px,-2px)}
.dayb[aria-pressed="true"]{outline:2.5px dashed var(--ol);outline-offset:2px}
.feel{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:7px 13px;border-radius:99px;border:2px solid var(--ol);background:var(--card);font-size:13px;font-weight:700}
.pill[aria-pressed="true"]{background:var(--ol);color:var(--paper)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 0;border-radius:14px;font-weight:800;font-size:15px;color:var(--on1);background:var(--c1);border:2.5px solid var(--ol);box-shadow:4px 4px 0 var(--ol)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ol)}
.btn.ghost{background:var(--card);color:var(--txt)}
.btn.sm{width:auto;padding:8px 14px;font-size:13.5px}
.btn:disabled{opacity:.45}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.link{font-weight:800;font-size:13.5px;padding:6px 0;text-decoration:underline;text-decoration-thickness:3px;text-decoration-color:var(--c1);text-underline-offset:4px}

/* stickers */
.sweek{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:11px;font-weight:800;margin-top:10px}
.sc{position:relative;aspect-ratio:1;border:2px dashed var(--line);border-radius:10px;margin-bottom:4px}
.sc.now{border:2.5px solid var(--ol)}
.st{position:absolute;inset:-4px;transform:rotate(var(--r))}
.st svg{width:100%;height:100%;display:block;filter:drop-shadow(0 1.5px 1px rgba(0,0,0,.3))}
.smonth{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:8px;text-align:center}
.smonth div{position:relative;aspect-ratio:1;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--sub)}
.smonth .lab{aspect-ratio:auto;font-weight:800;color:var(--txt)}
.smonth .now{background:var(--c1);color:var(--on1);border:2px solid var(--ol);border-radius:8px;font-weight:800}

/* shelf and forms */
.prod{display:grid;grid-template-columns:42px minmax(0,1fr) 20px;gap:12px;align-items:center;width:100%;padding:12px 0}
.prod+.prod{border-top:2px dashed var(--line)}
.gem{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:19px;color:var(--on1);background:var(--c1);border:2px solid var(--ol)}
.prod.off{opacity:.55}
.prod b{display:block;font-weight:800;font-size:15px;overflow-wrap:anywhere}
.search{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;background:var(--card);border:2.5px solid var(--ol);box-shadow:3px 3px 0 var(--ol)}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:15px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-family:var(--hand);font-weight:700;font-size:18px;color:var(--sub)}
.inp{width:100%;padding:11px 13px;border-radius:12px;border:2px solid var(--ol);background:var(--paper);font-size:15px;appearance:none;-webkit-appearance:none}
.inp:focus{outline:none;box-shadow:3px 3px 0 var(--c1)}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:2px dashed var(--line)}
.frow:first-child{border-top:0}
.frow .inp{max-width:170px}
.sw{width:50px;height:30px;border-radius:99px;background:var(--card);border:2.5px solid var(--ol);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--ol);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--c1)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:10px;border:2px solid var(--ol);background:var(--card);display:grid;place-items:center;font-size:18px;font-weight:800}
.stepper b{min-width:56px;text-align:center;font-weight:800;font-size:17px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.days button{aspect-ratio:1;max-width:44px;width:100%;border-radius:10px;justify-self:center;text-align:center;border:2px solid var(--ol);background:var(--card);font-size:12px;font-weight:800}
.days button[aria-pressed="true"]{background:var(--c1);color:var(--on1)}
.rate{display:flex;gap:6px}
.rate button{flex:1;padding:9px 0;border-radius:10px;border:2px solid var(--ol);background:var(--card);text-align:center;font-weight:800;font-size:16px}
.rate button[aria-pressed="true"]{background:var(--c1);color:var(--on1);box-shadow:3px 3px 0 var(--ol)}
.spark{width:100%;height:70px;display:block}
textarea.inp{min-height:80px;resize:vertical}
.cmp{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--paper);border:2.5px solid var(--ol);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none;pointer-events:none}
.cmp .h{position:absolute;top:0;bottom:0;width:3px;background:var(--ol);transform:translateX(-1.5px);pointer-events:none}
.cmp .h::after{content:"";position:absolute;top:50%;left:50%;width:30px;height:30px;border-radius:8px;background:var(--c1);border:2.5px solid var(--ol);transform:translate(-50%,-50%)}
.lbl{position:absolute;top:10px;padding:2px 8px;border-radius:8px;background:var(--card);border:2px solid var(--ol);font-size:11px;font-weight:800}
.lbl.l{left:10px} .lbl.r{right:10px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:2px}
.thumbs button{flex:none;width:58px;text-align:center}
.thumbs img{width:58px;height:76px;object-fit:cover;border-radius:10px;display:block;border:2px solid var(--ol)}
.thumbs button[aria-pressed="true"] img{box-shadow:3px 3px 0 var(--c1)}
.thumbs small{font-size:11px;color:var(--sub)}
.palettes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.palettes button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:12px;border:2px solid var(--ol);background:var(--card);font-weight:800;font-size:12.5px}
.palettes button[aria-pressed="true"]{box-shadow:4px 4px 0 var(--ol);transform:translate(-1px,-2px)}
.palettes i{display:flex}
.palettes i b{width:18px;height:18px;border-radius:50%;border:2px solid var(--ol);margin-left:-6px}
.palettes i b:first-child{margin-left:0}

/* setup */
.ob{display:flex;flex-direction:column;gap:20px;padding-bottom:90px}
.wordmark{align-self:flex-start;font-weight:800;font-size:clamp(70px,22vw,104px);line-height:1;letter-spacing:-.06em;background:var(--ol);color:var(--paper);padding:4px 26px 16px;border-radius:24px;transform:rotate(-4deg);margin-top:9vh;box-shadow:8px 8px 0 var(--c1)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:9px 14px;border-radius:12px;border:2px solid var(--ol);background:var(--card);font-weight:700;font-size:14px}
.opt[aria-pressed="true"]{background:var(--c1);color:var(--on1);box-shadow:3px 3px 0 var(--ol)}
.cta{position:fixed;z-index:6;left:0;right:0;bottom:0;padding:24px 18px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--paper) 40%)}
.cta .btn{max-width:484px;margin:0 auto}
.dots{display:flex;gap:5px}
.dots i{width:18px;height:8px;border-radius:3px;border:1.5px solid var(--ol);background:var(--card)}
.dots i.on{background:var(--ol)}

/* dock and timer */
.dock{position:fixed;z-index:5;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:496px;margin:0 auto;background:var(--ol);border:2.5px solid var(--ol);border-radius:18px;padding:6px}
.dock div{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.dock button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 5px;border-radius:12px;font-size:11px;font-weight:800;color:var(--paper);opacity:.75}
.dock button[aria-current="page"]{background:var(--c1);color:var(--on1);opacity:1}
.timer{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;padding:8px 10px 8px 16px;border-radius:14px;background:var(--c1);color:var(--on1);border:2.5px solid var(--ol);box-shadow:4px 4px 0 var(--ol);font-weight:800;white-space:nowrap}
.timer b{font-size:20px}
.timer button{padding:5px 11px;border-radius:9px;border:2px solid currentColor;font-size:12.5px;font-weight:800}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- motion and play ---------- */
.btn,.pillar,.card,.dayb,.pill,.palettes button,.opt,.gem,.seg button,.tick,.timerbtn,.dragchip,.slot{transition:transform .12s ease,box-shadow .12s ease,background-color .2s}
.btn:active,.pillar:active,button.card:active,.dayb:active,.palettes button:active,.opt:active,.dragchip:active{transform:translate(3px,3px)!important;box-shadow:1px 1px 0 var(--ol)!important}
.pill:active,.seg button:active,.timerbtn:active{transform:translate(1px,1px) scale(.96)}
.tick:active{transform:scale(.86)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.045) rotate(-.7deg)}100%{transform:scale(1)}}
.step.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes draw{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.step.pop .tick::after{animation:draw .32s ease-out}
@keyframes flip{0%{transform:perspective(900px) rotateY(-95deg) rotate(-1.2deg);opacity:.4}100%{transform:perspective(900px) rotateY(0) rotate(-1.2deg);opacity:1}}
.hero.flip{animation:flip .5s cubic-bezier(.2,.9,.3,1.15)}
@keyframes drop{0%{transform:translateY(-46px) rotate(-8deg);opacity:0}55%{transform:translateY(5px) rotate(.6deg);opacity:1}78%{transform:translateY(-2px) rotate(-2deg)}100%{transform:rotate(-1.2deg)}}
.hero.drop{animation:drop .65s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{transform:translateY(26px);opacity:0}}
.rise{animation:rise .5s cubic-bezier(.2,.8,.3,1.15) both;animation-delay:calc(var(--i,0)*70ms)}
.step{position:relative;touch-action:pan-y}
.step.dragging{transition:none}
.step.sw-r{background:var(--done);color:#151215}
.step.sw-l{background:var(--line)}
.step.skip{opacity:.55}
.step.skip .what b{text-decoration:line-through;text-decoration-style:dashed}
.swipehint{text-align:center;font-family:var(--hand);font-weight:700;font-size:17px;color:var(--sub);margin-top:-6px}
.timer svg{width:30px;height:30px;transform:rotate(-90deg);flex:none}
.timer svg circle{fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round}
.timer svg .bg{opacity:.25}
@keyframes jig{0%,100%{transform:translateX(-50%) rotate(0)}20%{transform:translateX(-50%) rotate(-5deg)}40%{transform:translateX(-50%) rotate(5deg)}60%{transform:translateX(-50%) rotate(-3deg)}80%{transform:translateX(-50%) rotate(3deg)}}
.timer.ding{animation:jig .6s 3}

.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(21,18,21,.5);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.ov.clear{background:transparent;pointer-events:none;align-items:center;overflow:hidden}
.sheet{width:100%;max-width:480px;background:var(--card);color:var(--txt);border:3px solid var(--ol);border-radius:20px;box-shadow:6px 6px 0 var(--ol);padding:20px;animation:up .45s cubic-bezier(.2,.9,.3,1.12)}
@keyframes up{from{transform:translateY(115%)}}
.pick3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.pick3 button{aspect-ratio:1;border:2.5px dashed var(--line);border-radius:16px;padding:12px;transition:transform .15s}
.pick3 button svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.pick3 button:hover,.pick3 button:focus-visible{transform:scale(1.07) rotate(-5deg);border-color:var(--ol)}
.pick3 button:nth-child(2){animation:rise .4s .08s both}.pick3 button:nth-child(3){animation:rise .4s .16s both}.pick3 button:nth-child(1){animation:rise .4s both}
.slap{width:min(56vw,230px);animation:slap .6s cubic-bezier(.3,1.5,.5,1) both}
