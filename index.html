<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rota">
<meta name="theme-color" content="#11100f">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Rota</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a quiet phone app. One score ring leads, everything else is hairline lists on a warm charcoal ground. Serif for headlines and numerals, sans for everything you tap. */
:root{
  color-scheme:dark;
  --bg:#11100f; --surface:#1a1816; --surface-2:#262320; --line:rgba(236,230,220,.1);
  --fg:#efe9df; --muted:#a39b90; --faint:#6f685f;
  --accent:#e3d0b4; --accent-2:#b69a78; --ink:#1a1510;
  --acid:#bfa9d1; --ret:#d9a08d; --aza:#d9bf8c; --bp:#9db7d1; --rec:#a9c1a5; --warn:#e0a86e;
  --dock:rgba(20,18,17,.88); --shadow:rgba(0,0,0,.5);
  --serif:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --sans:"Instrument Sans","Helvetica Neue","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(90% 42% at 50% -8%,color-mix(in srgb,var(--accent) 13%,transparent),transparent 70%)}
#app{position:relative;max-width:500px;margin:0 auto;padding-inline:22px;padding-block:14px calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
h1,h2,h3,p,ol,ul{margin:0;padding:0}
ol,ul{list-style:none}
h1{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.08;letter-spacing:-.015em;text-wrap:balance}
h1 em{font-style:italic}
h2{font-family:var(--serif);font-weight:400;font-size:23px;line-height:1.15}
.sub{color:var(--muted);font-size:14px}
.eyebrow{font-size:11.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums lining-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:left}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.c-acid{color:var(--acid)} .c-ret{color:var(--ret)} .c-aza{color:var(--aza)} .c-bp{color:var(--bp)} .c-rec{color:var(--rec)}
.b-acid{background:var(--acid)} .b-ret{background:var(--ret)} .b-aza{background:var(--aza)} .b-bp{background:var(--bp)} .b-rec{background:var(--rec)}

.bar{display:flex;align-items:center;justify-content:space-between;min-height:40px}
.mark{font-family:var(--serif);font-style:italic;font-size:26px;letter-spacing:-.01em}
.icon{width:40px;height:40px;display:grid;place-items:center;color:var(--muted);margin-right:-9px}
.head{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:22px;padding:20px;min-width:0}
.rowhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}

/* Today */
.ring{position:relative;width:212px;max-width:100%;aspect-ratio:1;margin:2px auto 0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--surface-2)} .ring .arc{stroke:url(#grad);transition:stroke-dashoffset .7s cubic-bezier(.3,.8,.3,1)}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring b{font-family:var(--serif);font-weight:400;font-size:76px;line-height:.95}
.ring span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-block:1px solid var(--line)}
.trio div{padding:14px 4px;text-align:center;display:flex;flex-direction:column;gap:5px}
.trio div+div{border-left:1px solid var(--line)}
.trio b{font-family:var(--serif);font-weight:400;font-size:19px;line-height:1.1}
.tabs2{display:flex;gap:26px;border-bottom:1px solid var(--line)}
.tabs2 button{padding:0 0 11px;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--faint);border-bottom:1.5px solid transparent;margin-bottom:-1px}
.tabs2 button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.list{margin-top:-14px}
.list li+li{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:15px 0}
.row .idx{font-size:13px;color:var(--faint);width:38px;text-align:center}
.row .th{width:38px;height:38px;border-radius:10px;object-fit:cover;flex:none}
.row .what{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .what b{font-weight:500;font-size:16px}
.row .what small{font-size:13px;color:var(--muted)}
.tagc{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.tick{width:28px;height:28px;border-radius:50%;border:1.3px solid var(--faint);display:grid;place-items:center;color:transparent;flex:none;transition:background .2s}
.tick svg{width:15px;height:15px;stroke-width:2}
[aria-pressed="true"]>.tick{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.row[aria-pressed="true"] .what b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.empty{padding:18px 0;color:var(--muted);font-size:14px}
.feel{display:flex;flex-direction:column;gap:12px}
.pills{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.pill{padding:11px 0;border-radius:99px;border:1px solid var(--line);text-align:center;font-size:13.5px;font-weight:500;color:var(--muted)}
.pill[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.note{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.4;color:var(--muted);text-wrap:pretty}

/* Week */
.arrows{display:flex;gap:4px}
.arrows button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.arrows button:disabled{opacity:.3}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dayb{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 0 10px;border-radius:99px;width:100%}
.dayb small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600}
.dayb b{font-family:var(--serif);font-weight:400;font-size:21px;line-height:1}
.dayb .dot{width:6px;height:6px;border-radius:50%}
.dayb .ap{display:flex;gap:3px}
.dayb .ap i{width:8px;height:2px;border-radius:2px;background:var(--surface-2)}
.dayb .ap i.on{background:var(--accent)}
.dayb[aria-pressed="true"]{background:var(--surface)}
.dayb.today small{color:var(--accent)}
div.dayb{padding:10px 0}
div.dayb em{font-style:normal;font-size:12px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--muted);justify-content:center}
.legend i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;vertical-align:2px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:15px 0;border-radius:99px;background:var(--accent);color:var(--ink);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.btn:disabled{opacity:.35}
.btn svg{width:16px;height:16px}

/* Progress */
.map{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:7px;margin-top:18px}
.map i{aspect-ratio:1;border-radius:50%;background:var(--surface-2)}
.map i.l1{background:color-mix(in srgb,var(--accent) 45%,var(--surface-2))}
.map i.l2{background:var(--accent)}
.map i.now{outline:1.5px solid var(--fg);outline-offset:2px}
.mile{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:16px;align-items:center;width:100%;padding:14px 0}
.mile+.mile{border-top:1px solid var(--line)}
.mile b{font-weight:500;font-size:16px;display:block}
.mile[aria-pressed="true"] b{color:var(--muted)}
.tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--warn)}
.sync{text-align:center;font-size:12px;color:var(--faint)}

/* Photos */
.link{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--accent);padding:8px 0}
.cmp{position:relative;aspect-ratio:3/4;border-radius:22px;overflow:hidden;background:var(--surface);margin-top:16px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none;pointer-events:none}
.lbl{position:absolute;top:12px;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.lbl.l{left:12px} .lbl.r{right:12px}
.cmp .bar{position:absolute;top:0;bottom:0;width:2px;background:#fff;transform:translateX(-1px);pointer-events:none}
.cmp .bar::after{content:"";position:absolute;top:50%;left:50%;width:36px;height:36px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 2px 10px rgba(0,0,0,.4)}
.side{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.side figure{margin:0;position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:var(--surface)}
.side img{width:100%;height:100%;object-fit:cover;display:block}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pick select{width:100%;appearance:none;-webkit-appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;font-size:14px;margin-top:7px}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:16px;padding-bottom:4px}
.thumbs button{flex:none;width:62px}
.thumbs img{width:62px;height:82px;object-fit:cover;border-radius:12px;display:block;border:1.5px solid transparent}
.thumbs button[aria-pressed="true"] img{border-color:var(--accent)}
.thumbs small{display:block;text-align:center;font-size:11px;color:var(--muted);margin-top:5px}

/* Shop and butter */
.meter{height:3px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:16px}
.meter i{display:block;height:100%;background:var(--accent);transition:width .4s}
.item{display:flex;align-items:center;gap:16px;width:100%;padding:14px 0}
.item+.item{border-top:1px solid var(--line)}
.item .what{flex:1;min-width:0}
.item b{font-weight:500;font-size:16px;display:block}
.item[aria-pressed="true"] b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;margin:18px 0 8px}
.stack i{display:block;min-width:3px}
.ing{display:grid;grid-template-columns:8px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 0}
.ing+.ing{border-top:1px solid var(--line)}
.ing i{width:8px;height:8px;border-radius:50%}
.ing .pct{color:var(--muted);font-size:13px;min-width:44px;text-align:right}
.ing b{min-width:64px;text-align:right;font-family:var(--serif);font-weight:400;font-size:19px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:19px}
.stepper b{font-family:var(--serif);font-weight:400;font-size:22px;min-width:74px;text-align:center}
.how li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:14px;padding:13px 0;align-items:baseline}
.how li+li{border-top:1px solid var(--line)}
.how li span{font-size:13px;color:var(--faint)}

/* Settings */
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.theme{display:flex;flex-direction:column;align-items:center;gap:9px;padding:14px 4px 12px;border-radius:18px;border:1px solid var(--line);font-size:12px;font-weight:500;text-align:center;color:var(--muted)}
.theme i{width:40px;height:40px;border-radius:50%;border:1px solid var(--line)}
.theme[aria-pressed="true"]{border-color:var(--accent);color:var(--fg)}
.prod{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 0}
.prod+.prod{border-top:1px solid var(--line)}
.prod label,.lab{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;display:block}
.txt{width:100%;background:transparent;border:0;border-bottom:1px solid transparent;padding:4px 0 3px;font-size:16px;font-weight:500;border-radius:0}
.txt::placeholder{color:var(--faint);font-weight:400}
.txt:focus{outline:none;border-bottom-color:var(--accent)}
.sw{width:46px;height:28px;border-radius:99px;background:var(--surface-2);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(18px);background:var(--ink)}
.del{color:var(--muted);width:40px;height:40px;display:grid;place-items:center;margin-right:-8px}
.add{display:grid;gap:10px;margin-top:16px}
.add .txt{border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:var(--bg)}
.add select.txt{appearance:none;-webkit-appearance:none}
.field{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0}
.field+.field{border-top:1px solid var(--line)}
.field>label,.field>span{font-size:15px}
.field .txt{max-width:150px;text-align:right}
.field input[type=date]{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:7px 10px}
.checks{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.checks li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;font-size:14px;color:var(--muted)}
.checks svg{width:18px;height:18px;margin-top:1px}
.checks .ok svg{color:var(--rec)} .checks .warn{color:var(--fg)} .checks .warn svg{color:var(--warn)} .checks .tip svg{color:var(--accent)}
.fine{font-size:12px;color:var(--faint);text-align:center}

/* Onboarding */
.ob{min-height:calc(100vh - 150px);display:flex;flex-direction:column;gap:22px}
.hero-mark{font-family:var(--serif);font-style:italic;font-size:92px;line-height:1;letter-spacing:-.03em;margin-top:18vh}
.opts{margin-top:-8px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:15px 0}
.opt+.opt{border-top:1px solid var(--line)}
.opt .what{flex:1;min-width:0}
.opt b{font-weight:500;font-size:16px;display:block}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:26px 22px calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 34%)}
.cta .btn{max-width:456px;margin:0 auto}

/* Tonight */
.tonight{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center}
.tonight h2{font-size:46px;line-height:1;letter-spacing:-.02em;margin:10px 0 8px}
.why{font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.38;color:var(--muted);text-wrap:pretty}
.tonight .why{grid-column:1/-1;margin-top:10px;padding-top:14px;border-top:1px solid var(--line)}
.mini{position:relative;width:78px;height:78px;flex:none}
.mini svg{width:100%;height:100%;transform:rotate(-90deg)}
.mini .track{stroke:var(--surface-2)} .mini .arc{stroke:url(#grad);transition:stroke-dashoffset .7s cubic-bezier(.3,.8,.3,1)}
.mini div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.mini b{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1}
.mini span{font-size:11px;color:var(--muted)}
.meta{display:flex;justify-content:space-between;gap:12px;margin-top:-8px}
/* Shelf */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
.pcard{display:flex;flex-direction:column;gap:10px;width:100%;min-width:0}
.pic{aspect-ratio:4/5;border-radius:18px;background:var(--surface);overflow:hidden;display:grid;place-items:center;position:relative;width:100%}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.pic .init{font-family:var(--serif);font-style:italic;font-size:68px;color:var(--faint);line-height:1}
.pcard.off .pic,.pcard.off b{opacity:.45}
.pcard b{font-weight:500;font-size:15px;display:block;margin-top:4px;overflow-wrap:anywhere}
.badge{position:absolute;left:10px;bottom:10px;padding:4px 9px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.detail{display:flex;flex-direction:column;gap:20px}
.detail .pic{max-width:230px;margin:0 auto}
/* Dock */
.dock{position:fixed;z-index:5;left:0;right:0;bottom:0;background:var(--dock);border-top:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px))}
.dock div{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;max-width:500px;margin:0 auto}
.dock button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--faint)}
.dock button[aria-current="page"]{color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent-2)"/></linearGradient></defs></svg>
<main id="app"></main>
<nav class="dock" aria-label="Sections" id="docknav"><div id="dock"></div></nav>
<input type="file" accept="image/*" id="shot" hidden>

<script>
(function(){
  var PERSONAL=false, MY_NAME='', DAYS=84;
  var app=document.getElementById('app'), dock=document.getElementById('dock'), docknav=document.getElementById('docknav');
  var ref=null, writing=false, dirty=false, readOnly=false, syncMsg='';

  var P={
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5V5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8"/>',
    moon:'<path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/>',
    check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    alert:'<path d="M12 4l9 15.500H3zM12 10v4.500M12 17v.200"/>',
    spark:'<path d="M12 3.500c.600 4.600 3.300 7.300 8 8-4.700.700-7.400 3.400-8 8-.600-4.600-3.300-7.300-8-8 4.700-.700 7.400-3.400 8-8z"/>',
    cal:'<path d="M4.5 6.5h15v13h-15zM4.5 10.5h15M8.5 4v4M15.5 4v4"/>',
    chart:'<path d="M5 19v-8M12 19V5M19 19v-6"/>',
    bag:'<path d="M5.5 8h13l-1 12h-11zM9 8V6.5a3 3 0 0 1 6 0V8"/>',
    jar:'<path d="M7 8h10v9a3 3 0 0 1-3 3h-4a3 3 0 0 1-3-3zM6 4.5h12V8H6z"/>',

    var views={today:vToday,week:vWeek,progress:vProgress,shelf:vShelf,more:vMore,settings:vSettings};
    if(ui.tab==='shop'||ui.tab==='butter'){ui.more=ui.tab;ui.tab='more'}
    if(!views[ui.tab]||(!state.extras&&ui.tab==='more'))ui.tab='today';
    app.innerHTML=views[ui.tab](st);
    docknav.hidden=false;
    dock.innerHTML=tabs().map(function(t){return '<button data-act="tab" data-id="'+t[0]+'"'+(t[0]===ui.tab?' aria-current="page"':'')+'>'+ic(t[1])+t[2]+'</button>'}).join('');
    var arc=document.getElementById('arc');
    if(arc)requestAnimationFrame(function(){requestAnimationFrame(function(){arc.setAttribute('stroke-dashoffset',arc.dataset.to)})});
  }

  /* ---------- events ---------- */
  function prod(id){return state.products.filter(function(p){return p.id===id})[0]}
  function id2(){return ui.prodSel}
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-act]'); if(!b||b.disabled)return;
    var a=b.dataset.act, id=b.dataset.id, now=new Date(), p;
    if(a==='tab'){ui.tab=id;ui.prodSel=null;ui.rm=false; try{history.replaceState(null,'','#'+id)}catch(x){} render(); window.scrollTo(0,0)}
    else if(a==='slot'){ui.slot=id;render()}
    else if(a==='step')toggleStep(now,ui.slot,id);
    else if(a==='feel'){var k=key(now); if(state.feel[k]===id)delete state.feel[k]; else state.feel[k]=id; commit()}
    else if(a==='day'){ui.day=id;render()}
    else if(a==='wk'){ui.week=Math.min(12,Math.max(1,ui.week+(+id)));ui.day=null;render()}
    else if(a==='slotday'){var d=parse(ui.day);put(ui.day,id,isDone(d,id)?null:true)}
    else if(a==='mile'){var mm=miles().filter(function(x){return x.id===id})[0];
      if(state.miles[id]){delete state.miles[id];commit()} else if(mm&&mm.cam&&!ui.photoMsg){ui.pendingMile=id;ui.shotFor=null;shot.click()} else {state.miles[id]=true;commit()}}
    else if(a==='photo'){ui.pendingMile=null;ui.shotFor=null;shot.click()}
    else if(a==='cmpmode'){ui.cmpMode=id;render()}
    else if(a==='selp'){ui.selP=ui.selP===id?null:id;ui.rm=false;render()}
    else if(a==='rmphoto'){if(!ui.rm){ui.rm=true;render()} else {var gone=ui.selP;ui.selP=null;ui.rm=false;tx('readwrite',function(o){return o.delete(gone)}).then(loadPhotos).catch(function(){render()})}}
    else if(a==='shop'){if(state.shop[id])delete state.shop[id];else state.shop[id]=true;
      if(id==='oilcl')state.products.forEach(function(x){if(x.cat==='oil')x.on=!!state.shop.oilcl}); commit()}
    else if(a==='recipe'){ui.recipe=id;render()}
    else if(a==='batch'){state.batch=Math.min(1000,Math.max(50,state.batch+(+id)));commit()}
    else if(a==='theme'){state.theme=id;commit()}
    else if(a==='sw'){p=prod(id); if(p){p.on=!p.on; if(p.on)p.since=key(now); commit()}}
    else if(a==='more'){ui.more=id;render()}
    else if(a==='psel'){ui.prodSel=id;ui.rm=false;render();window.scrollTo(0,0)}
    else if(a==='pback'){ui.prodSel=null;ui.rm=false;render();window.scrollTo(0,0)}
    else if(a==='pwhen'){p=prod(id2(b)); if(p){p.w=id==='both'?'':id;commit()}}
    else if(a==='pphoto'){ui.shotFor=id;shot.click()}
    else if(a==='prmphoto'){delete ui.pimg[id];tx('readwrite',function(o){return o.delete(id)},'prod').then(loadPhotos).catch(function(){render()})}
    else if(a==='extras'){state.extras=!state.extras;commit()}
    else if(a==='when'){ui.when=id;render()}
    else if(a==='addp'){var nid='c'+Date.now().toString(36);state.products.push({id:nid,cat:CATS[ui.newCat]?ui.newCat:'se',n:'',p:ui.newP.trim().slice(0,40),w:'',on:true,x:1,since:key(now)}); ui.newP='';ui.prodSel=nid;commit();window.scrollTo(0,0)}
    else if(a==='delp'){if(!ui.rm){ui.rm=true;render()} else {ui.rm=false;ui.prodSel=null;state.products=state.products.filter(function(x){return x.id!==id});delete ui.pimg[id];tx('readwrite',function(o){return o.delete(id)},'prod').catch(function(){});commit();window.scrollTo(0,0)}}
    else if(a==='redo'){ui.ob=1;ui.shelf={};state.products.forEach(function(x){if(x.on)ui.shelf[x.cat]=true});ui.goals={};state.goals.forEach(function(g){ui.goals[g]=true});
      ui.react=Math.max(0,[2,3,4].indexOf(state.ramp));state.setup=false;commit();window.scrollTo(0,0)}
    else if(a==='goal'){ui.goals[id]=!ui.goals[id];render()}
    else if(a==='react'){ui.react=+id;render()}
    else if(a==='shelf'){ui.shelf[id]=!ui.shelf[id];render()}
    else if(a==='ob'){var nx=ui.ob+(+id); if(ui.ob===2&&nx===3){build();save()} ui.ob=Math.max(0,Math.min(3,nx));render();window.scrollTo(0,0)}
    else if(a==='finish'){if(!Object.keys(state.checks).length)state.start=key(now); state.setup=true;ui.tab='today';ui.week=null;ui.ob=0;commit();window.scrollTo(0,0)}
  });
  document.addEventListener('input',function(e){ if(e.target.id==='new-p')ui.newP=e.target.value; });
  document.addEventListener('change',function(e){
    var t=e.target, ed=t.dataset&&t.dataset.edit, v=(t.value||'').trim();
    if(readOnly)return;
    if(t.id==='new-cat'){ui.newCat=t.value;return}
    if(t.id==='cmp-a'){ui.cmpA=t.value;render();return}
    if(t.id==='cmp-b'){ui.cmpB=t.value;render();return}
    if(ed==='p'){var p=prod(t.dataset.id); if(p){p.p=v.slice(0,40);save()} return}
    if(ed==='name'){state.name=v.slice(0,20);save();return}
    if(t.id==='start'&&/^\d{4}-\d{2}-\d{2}$/.test(t.value)){state.start=t.value;ui.week=null;ui.day=null;commit()}
  });

  /* ---------- saving ---------- */
  function save(){ try{localStorage.setItem('skin-rotation',JSON.stringify(state))}catch(e){} flush(); }
  function commit(){ render(); save(); }
  async function flush(){
    if(!ref||readOnly)return;
    if(writing){dirty=true;return}
    writing=true;
    do{ dirty=false;
      try{ await ref.set(JSON.parse(JSON.stringify(state))); syncMsg='Saved to your account'; }
      catch(e){ if(e&&e.code==='invalid_argument'){readOnly=true;syncMsg='View only on this account';render()} else syncMsg='Could not save just now. Your next tap will retry.'; break; }
    }while(dirty);
    writing=false;
  }
  function obj(o){return (o&&typeof o==='object'&&!Array.isArray(o))?JSON.parse(JSON.stringify(o)):{}}
  /* Data saved by the earlier version of this app is carried over, with its products and check marks intact. */
  function migrate(d){
    var st=obj(d.steps), sh=obj(d.shop);
    var prods=herProducts().map(function(p){var o=st[p.id]||{}; if(typeof o.p==='string'&&o.p)p.p=o.p; if(typeof o.off==='boolean')p.on=!o.off; else if(p.id==='oc')p.on=!!sh.oilcl; return p});
    (Array.isArray(d.custom)?d.custom:[]).forEach(function(c){if(c&&typeof c.id==='string'&&typeof c.n==='string')prods.push({id:c.id,cat:'se',n:c.n,p:c.p,w:c.w,on:true,x:1})});
    return {v:2,setup:true,extras:true,start:d.start,ramp:2,goals:[],name:typeof d.name==='string'?d.name:MY_NAME,theme:d.theme,products:prods,checks:d.checks,miles:d.miles,shop:d.shop,feel:{},batch:d.batch};
  }
  function clean(d){
    var f=fresh();
    return {v:2,setup:!!d.setup,extras:!!d.extras,start:/^\d{4}-\d{2}-\d{2}$/.test(d.start)?d.start:f.start,ramp:[2,3,4].indexOf(+d.ramp)>=0?+d.ramp:2,
      goals:Array.isArray(d.goals)?d.goals.filter(function(g){return GOALS[g]}):[],name:typeof d.name==='string'?d.name.slice(0,20):'',
      theme:THEME_IDS[d.theme]?d.theme:(d.theme==='day'?'bone':'stone'),
      products:Array.isArray(d.products)?d.products.filter(function(p){return p&&typeof p.id==='string'&&CATS[p.cat]}).slice(0,24).map(function(p){
        return {id:p.id.slice(0,24),cat:p.cat,n:typeof p.n==='string'?p.n.slice(0,30):'',p:String(p.p||'').slice(0,40),w:WHEN[p.w]?p.w:'',on:p.on!==false,x:p.x?1:0,since:/^\d{4}-\d{2}-\d{2}$/.test(p.since)?p.since:''}}):[],
      checks:obj(d.checks),miles:obj(d.miles),shop:obj(d.shop),feel:obj(d.feel),batch:(+d.batch>=50&&+d.batch<=1000)?+d.batch:200};
  }
  function adopt(d){ if(d&&typeof d==='object')state=clean(d.v===2?d:migrate(d)); }

  var h=(location.hash||'').slice(1); if(h)ui.tab=h;
  try{var saved=localStorage.getItem('skin-rotation'); if(saved)adopt(JSON.parse(saved))}catch(e){}
  syncMsg='Saved on this phone';
  render();
  loadPhotos();

  (window.claude&&window.claude.use?window.claude.use('db'):Promise.resolve(null)).then(function(db){
    if(!db)return;
    ref=db.doc('tracker/state');
    ref.onSnapshot(function(snap){
      if(writing||snap.metadata.hasPendingWrites)return;
      syncMsg='Saved to your account';
      if(snap.exists){adopt(snap.data());ui.week=null;ui.day=null}
      render();
    },function(){ ref=null; syncMsg='Saved on this phone'; });
  }).catch(function(){});
})();
</script>

<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}</script>
